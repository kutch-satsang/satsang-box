<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>સત્સંગ બોક્સ</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f08a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="સત્સંગ બોક્સ">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--ink:#4a2c1c;--deep:#5a3524;--muted:#7b5a3a;--card:#fffaf0;--line:#e3c9a4;--accent:#e8845f;--page:#f4e3cc;
  color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--page);color:var(--ink);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:0 0 28px;min-height:100vh}
/* ---- ઘર (ચિત્ર-થીમ) ---- */
.stage{position:relative;--av:calc(100dvh - 84px - env(safe-area-inset-bottom,0px));width:100%;height:var(--av);margin:0 auto;container-type:inline-size;background:none;overflow:hidden}
.sc{position:absolute;left:0;right:0;top:min(0px,calc(var(--av) - 187.6cqw));height:187.6cqw}
.stage .el{position:absolute;display:block;text-decoration:none;color:inherit;filter:var(--drop,none);transition:transform .15s}
.stage a.el:active{transform:scale(.97)}
.stage a.el:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:30px}
.stage img{display:block;width:100%;height:100%}
.st{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;pointer-events:none;color:var(--lab)}
.st.ti{color:var(--tc);text-shadow:var(--tsh)}
.lng3d{flex:none;width:42px;height:42px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;display:grid;place-items:center;align-content:center;color:#4a2a0a;background:radial-gradient(circle at 32% 26%,#fff4d2 0%,#f1c66b 38%,#c9852a 100%);box-shadow:0 4px 0 #8a5a1b,0 8px 12px rgba(90,53,36,.45),inset 0 2px 3px rgba(255,255,255,.8),inset 0 -3px 5px rgba(120,70,10,.35);transition:transform .12s,box-shadow .12s}
.lng3d:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a1b,0 3px 6px rgba(90,53,36,.4),inset 0 2px 3px rgba(255,255,255,.6),inset 0 -2px 4px rgba(120,70,10,.35)}
.lng3d .le{font-size:18px;line-height:1}.lng3d .ll{font:800 9.5px/1 'Baloo Bhai 2',sans-serif;margin-top:1px}
.lng3d.hm{position:absolute;top:3.4cqw;right:3cqw;z-index:5;width:11.5cqw;height:11.5cqw}.lng3d.hm .le{font-size:5.4cqw}.lng3d.hm .ll{font-size:2.5cqw}
.lng3d.flash::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,196,.95) 0%,rgba(255,222,120,.55) 45%,rgba(255,222,120,0) 72%);animation:lngf .75s ease-out forwards;pointer-events:none}
@keyframes lngf{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.lgc{display:flex;justify-content:center;padding:4px 0 8px}
.lang{position:absolute;top:3.4cqw;right:3cqw;z-index:5;display:flex;gap:.8cqw;padding:.9cqw;border-radius:99px;background:var(--pillbg);border:var(--pillbd);box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.28)}
.lang button{border:0;background:transparent;color:var(--pillc);font:700 2.7cqw 'Baloo Bhai 2',sans-serif;min-width:6.6cqw;height:5.6cqw;border-radius:99px;cursor:pointer;padding:0 1cqw}
.lang button.on{background:var(--accent);color:#fff;box-shadow:inset 0 -.5cqw .8cqw rgba(0,0,0,.18)}
.lang button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- અંદરનાં પેજ ---- */
.inner{padding:max(16px,env(safe-area-inset-top)) 16px 8px;min-height:100vh;background:var(--ibg);background-size:cover}
.grid{display:grid;gap:14px}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;border:var(--cardbd);background:var(--card);color:var(--deep);font:700 15px 'Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:var(--cardsh)}
.back:active{transform:scale(.96)}
.lang2{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);border:var(--cardbd)}
.lang2 button{border:0;background:transparent;color:var(--deep);font:700 14px 'Baloo Bhai 2',sans-serif;min-width:40px;height:34px;border-radius:99px;cursor:pointer}
.lang2 button.on{background:var(--accent);color:#fff}
.ztitle{margin:0 0 14px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:26px;color:var(--ztc);line-height:1.3}
a.game,div.game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:var(--cardbd);border-radius:22px;padding:14px 14px 14px 12px;box-shadow:var(--cardsh);transition:transform .15s}
a.game:active{transform:scale(.98)}
a.game:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.no{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#f2a07f,var(--accent));color:#fff;font-family:'Baloo Bhai 2',sans-serif;font-weight:700;font-size:22px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 2px 5px rgba(0,0,0,.18)}
.txt{min-width:0}
.name{font-weight:700;font-size:19px;line-height:1.35;color:var(--deep)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.play{flex:none;padding:9px 16px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.2)}
.play.soon{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--line);font-size:13px;font-weight:600}
div.game{opacity:.92}
footer{text-align:center;margin-top:22px;padding:0 16px;font-size:12px;color:var(--fc)}

/* ---- લીલો-સોનેરી: અંદરનાં પેજ + નીચેનું મેનુ (ઘર માટીનું જ રહે) ---- */
:root{--ca:linear-gradient(180deg,#f2a07f,#e8845f);--csh:0 .5rem 1.1rem rgba(120,80,40,.22),inset 0 2px 3px #fff,inset 0 -6px 10px rgba(180,130,80,.1);--zg:linear-gradient(180deg,#f6d98b,#d9a838);--zpanel:linear-gradient(165deg,#1b5b52 0%,#0f423c 60%,#0c3733 100%);--zrim:rgba(224,187,98,.55);--zsh:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -10px 18px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.38)}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap.home{height:100dvh;min-height:0;padding-bottom:0;overflow:hidden}
html.homef,html.homef body{overflow:hidden;height:100%}
/* અંદરનાં પેજ: માટી (ક્લે) સ્ટાઇલ — ક્રીમ ટાઇલ, ટેરાકોટા બટન, ઓલિવ લીલો */
.inner.gg{background:none;color:var(--ink)}
.gg .back,.gg .lang2{background:linear-gradient(160deg,#fdf5e8,#f3e3cb);border:0;box-shadow:var(--csh);color:var(--deep)}
.gg .lang2 button{color:var(--muted)}.gg .lang2 button.on{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15)}
.gg .ztitle{color:var(--deep)}
.gg a.game,.gg div.game,.gg .sbox{background:linear-gradient(160deg,#fdf5e8,#f3e3cb);border:0;box-shadow:var(--csh);border-radius:26px;color:var(--ink)}
.gg .name{color:var(--deep)}.gg .note{color:var(--muted)}
.gg .no{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 3px 6px rgba(120,80,40,.3)}
.gg .play{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 3px 6px rgba(120,80,40,.3)}
.gg .play.soon{background:transparent;color:var(--muted);border:1.5px dashed #d9bb90;box-shadow:none}
.sbox{border-radius:26px;padding:16px;margin:0 0 14px}
.sbox h3{margin:0 0 10px;font:700 18px 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;color:var(--deep)}
.sbox p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.sseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sseg button,.sbtn{border:0;background:linear-gradient(160deg,#fdf5e8,#efdcc0);color:var(--deep);border-radius:18px;min-height:50px;font:700 17px 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:var(--csh)}
.sseg button.on,.sbtn.gold{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),0 4px 8px rgba(120,80,40,.3)}
.sbtn{width:100%;padding:0 14px}
.gg footer{color:#8a6a52}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.bnav nav{pointer-events:auto;width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--zpanel);border-top:1.5px solid var(--zrim);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:#e0bb62;font:700 12px 'Noto Sans Gujarati',sans-serif;line-height:1.3;text-align:center}
.bnav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bnav a.on{background:var(--zg);color:#3a2600}
.bnav a:focus-visible{outline:3px solid #f6d98b;outline-offset:-2px}
@keyframes omsway{0%,100%{transform:perspective(500px) rotateY(-24deg) translateY(0)}50%{transform:perspective(500px) rotateY(24deg) translateY(-.8cqw)}}
.stage .om{animation:omsway 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.stage .el,a.game{transition:none}.stage .om{animation:none}}

/* નીચેનું મેનુ કાઢ્યું: તેની જગ્યા પણ પાછી */
.stage{--av:calc(100dvh - env(safe-area-inset-bottom,0px))!important}
.wrap{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wrap.home{padding-bottom:0}

/* V68 ક્લે ઘર: નવું ચિત્ર + કોડનું લખાણ, ઓમ ફરતો */
.omg{display:block;font-family:'Noto Sans Gujarati',sans-serif;font-weight:800;font-size:17.6cqw;line-height:1;color:#e0704a;text-shadow:0 .4cqw 0 #fff,0 -.3cqw 0 #d9754f,0 1cqw 1.2cqw rgba(120,60,20,.3)}
.cov{position:absolute;background:linear-gradient(160deg,#fbf1e2,#f1dcc0);box-shadow:0 .5cqw 1.2cqw rgba(120,80,40,.22),inset 0 2px 3px #fff}


/* V71: મંદિર (Play) પાનું = તમારું આખું ચિત્ર, ઉપર અદૃશ્ય બટન */
.mand.mfull{position:fixed;inset:0;padding:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(#f4e6d2,#efdcc2)}
.mbx{position:relative;container-type:inline-size;width:min(100vw,calc(100dvh * 3456 / 6144));aspect-ratio:3456/6144}
.mbx::before{content:"";position:absolute;left:-15%;right:-15%;top:-8%;bottom:-8%;background:url(themes/adhyatmik/mandir-full.webp) center/100% 100% no-repeat;pointer-events:none}
.mhit{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .12s}
.mhit:active{background:rgba(255,255,255,.22)}
.mback{left:4.4%;top:5.75%;width:11.6%;height:6.25%;border-radius:22%}
.mglobe{left:83.6%;top:5.75%;width:12%;height:6.75%;border-radius:50%}
.mplay2{left:21.8%;top:82%;width:56.4%;height:12.5%;border-radius:99px}
.mlang{position:absolute;left:50%;top:100%;transform:translate(-50%,-30%);font:800 2.9cqw/1.2 system-ui,sans-serif;color:#5a3524;background:#f6d98b;border-radius:99px;padding:.4cqw 1.6cqw;box-shadow:0 1px 3px rgba(90,53,36,.3)}
/* V70: સ્ક્રીન બદલાય ત્યારે સરળ ફેડ, ઝબકારો નહીં */
@keyframes sfade{from{opacity:0}to{opacity:1}}
.inner,.mand,.wrap.home{animation:sfade .22s ease-out both}

/* V74 સ્મુથ ખૂલવું: જૂનું પાનું ભૂંસાતું નથી, નવું તેના પર ધીમેથી ઉપસે; એકાદશી પહેલેથી લોડ */
#app{position:relative}
.inner{position:relative}
.wrap.home{animation:none}
.stage{animation:sfade .22s ease-out both}
#app>.xold{position:absolute!important;left:0;right:0;top:0;z-index:1;pointer-events:none;animation:none!important}
#app>*:not(.xold){z-index:2}
#ekLayer{position:fixed;inset:0;z-index:300;background:linear-gradient(#f6ead8,#efdcc2);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
#ekLayer.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .25s ease,visibility 0s}
#ekFrame{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .2s;background:transparent}
#ekFrame.rd{opacity:1}
</style>

<script src="analytics.js" defer></script>
<script src="box.js"></script>
<style>/* V48 ક્લે 3D મંદિર (હોમપેજ → જ્ઞાન-પ્રશ્ન વચ્ચે) */
.mand{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;background:radial-gradient(120% 70% at 50% 35%,rgba(251,241,227,.9),rgba(241,220,192,.6) 70%,rgba(233,207,172,.4))}
.mand .ihead{width:100%;max-width:560px}
.mbox{width:min(100%,600px);flex:1;display:flex;align-items:flex-end;justify-content:center;margin-top:6px}
.msvg{width:100%;height:auto;max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);cursor:pointer}
.msvg{-webkit-mask-image:radial-gradient(ellipse 60% 56% at 50% 50%,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse 60% 56% at 50% 50%,#000 72%,transparent 100%)}
.mplay{flex:none;margin:36px auto 22px;width:118px;height:118px;border-radius:50%;border:0;display:grid;place-items:center;padding-left:8px;cursor:pointer;background:radial-gradient(circle at 50% 40%,#f6b393,#e5845f 70%);box-shadow:0 8px 0 #b9583a,0 14px 24px rgba(120,80,40,.35),inset 0 3px 6px rgba(255,255,255,.4);transition:transform .1s}.mplay:active{transform:translateY(5px);box-shadow:0 3px 0 #b9583a,0 6px 12px rgba(120,80,40,.3)}

.mtl{text-align:center;color:#5a3524;margin-top:4px}.mtl b{display:block;font:800 clamp(30px,9vw,40px)/1.2 "Baloo Bhai 2","Noto Sans Gujarati",sans-serif;text-shadow:0 2px 0 #fff}.mtl small{color:#8a6a52;font-size:15px}
</style>
<style>/* V50 જ્ઞાન-પ્રશ્ન: મોટાં નામ, રમો/લખાણ નહીં, 3D */
.gz1 .note{display:none!important}.gz1 .play:not(.soon){display:none!important}
.gz1 .name{font-size:clamp(25px,7.4vw,32px)!important;line-height:1.2}
.gz1 .game{padding-top:24px!important;padding-bottom:24px!important;box-shadow:0 7px 0 #dfc39c,0 12px 20px rgba(120,80,40,.22),inset 0 2px 3px #fff!important}
.gz1 .game:active{transform:translateY(4px)}
</style>
<style>html.nosc,html.nosc body{overflow:hidden!important;height:100%;overscroll-behavior:none;touch-action:none}html.nosc .mand{touch-action:manipulation}</style>
<style>/* હબ Settings: સહિયારાં બટન + ઘર પર ⚙ */
.sset{display:grid;gap:8px}
.sset.c2{grid-template-columns:repeat(2,1fr)}.sset.c3{grid-template-columns:repeat(3,1fr)}.sset.c5{grid-template-columns:repeat(5,1fr)}
.sset button{border:0;background:linear-gradient(160deg,#fdf5e8,#efdcc0);color:var(--deep);border-radius:18px;min-height:50px;font:700 16px 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:var(--csh)}
.sset button.on{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),0 4px 8px rgba(120,80,40,.3)}
.sset button[disabled]{opacity:.55;cursor:default;border:1.5px dashed #d9bb90;box-shadow:none;background:transparent;color:var(--muted)}
.sbox .shint{margin-top:8px;font-size:13px;color:var(--muted)}
.sver{text-align:center;margin:18px 0 6px;font-size:12px;color:#8a6a52}
.sbtn.soft{background:linear-gradient(160deg,#fdf5e8,#efdcc0);color:var(--deep);box-shadow:var(--csh)}
.lng3d.gr{position:absolute;top:3.4cqw;left:3cqw;z-index:5;width:11.5cqw;height:11.5cqw}.lng3d.gr .le{font-size:5.4cqw}
</style>
<style>/* Settings એક જ સ્ક્રીનમાં, સ્ક્રોલ વગર */
.setp.inner{min-height:0;padding-bottom:6px}
.setp .ihead{margin:0 0 6px}.setp .ztitle{margin:0 0 8px;font-size:22px}
.setp .sbox{padding:10px 12px;margin:0 0 8px;border-radius:20px}
.setp .sbox h3{font-size:15px;margin:0 0 6px}
.setp .sset{gap:6px}.setp .sset button{min-height:40px;font-size:14px;border-radius:14px;padding:0 4px}
.setp .shint{margin-top:5px;font-size:11.5px;line-height:1.4}
.setp .sset.act{margin:0 0 8px}.setp .sset.act button{min-height:44px;font-size:14px}
.setp .abt h3{display:none}.setp .abt p{font-size:11.5px;line-height:1.45}
.setp .sver{margin:8px 0 0;font-size:11px}
</style>
<style>/* ✨ ક્લાસિક થીમ (કાચ) — html.cl */
html.cl{--ink:#2b3445;--deep:#2b3445;--muted:#6a768a;--accent:#f07b52;color-scheme:light}
html.cl body{color:#2b3445}
.clg{background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.28))!important;border:1px solid rgba(255,255,255,.85)!important;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 30px rgba(70,90,120,.16),0 2px 6px rgba(70,90,120,.08),inset 0 1px 0 rgba(255,255,255,.95)!important}
.clh{height:100dvh;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 16px;display:flex;flex-direction:column;gap:12px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;animation:sfade .22s ease-out both}
.cltop{display:flex;justify-content:space-between;align-items:flex-start}
.cldate{font-size:13px;color:#5d6a7e;font-weight:700;line-height:1.25}.cldate b{display:block;font-size:26px;color:#2b3445}
.clrb{display:flex;gap:8px}
.clbtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;align-content:center;padding:0;cursor:pointer;color:#5b6b85;font:800 9px/1 'Baloo Bhai 2',sans-serif}
.clbtn svg{width:22px;height:22px}.clbtn small{margin-top:1px}
.clbtn:active,.clt:active{transform:scale(.97)}
.clhero{border-radius:30px;padding:10px;display:flex;flex-direction:column;gap:8px}
.clscene{width:100%;height:150px;object-fit:cover;border-radius:22px;display:block}
.clhrow{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 4px}
.clhrow h1{margin:0;font-size:28px;font-weight:800;line-height:1.1}.clhrow small{display:block;font-size:13px;color:#6a768a;font-weight:700}
.clom{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#e0762f}
.clgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clt{border-radius:24px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-height:70px;text-decoration:none;color:#2b3445;white-space:nowrap;transition:transform .15s}
.clt.clwide{grid-column:1/-1;min-height:62px}
.clic{width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:grid;place-items:center}.clic svg{width:26px;height:26px}
@media(max-height:700px){.clh{gap:9px}.clscene{height:112px}.clt{min-height:58px;padding:8px 10px;font-size:15px}.clt.clwide{min-height:54px}.clic{width:40px;height:40px;flex-basis:40px}.cldate b{font-size:22px}.clhrow h1{font-size:25px}.clom{width:44px;height:44px;font-size:24px}}
