 "Extra 10 seconds", "Vadharini 10 second"], "revealDone": ["સમય પૂરો — સાચો જવાબ લીલો ઝબકે છે", "Time over — the correct answer is blinking green", "Samay puro — sacho javab lilo blink thay chhe"], "skip": ["આગળનો પ્રશ્ન", "Next Question", "Aagalno Prashna"], "skipDone": ["પ્રશ્ન છોડ્યો", "Question Skipped", "Prashna Chhodyo"], "comingShort": ["ટૂંક સમયમાં", "Coming soon", "Tunk samayma"], "introTitle": ["એકાદશી પ્રશ્ન", "Ekadashi Quiz", "Ekadashi Prashna"]}, MAHIMA={"gu":["સંવત્ ૧૮૭૮ ના શ્રાવણ સુદિ ૧૨ દ્વાદશીને દિવસ પ્રાતઃકાળને સમે સ્વામી શ્રીસહજાનંદજી મહારાજ શ્રીગઢડા મધ્યે દાદાખાચરના દરબારમાં શ્રીવાસુદેવનારાયણના મંદિર આગળ ચાકળા ઉપર વિરાજમાન હતા, અને સર્વે શ્વેત વસ્ત્ર ધારણ કર્યાં હતાં, અને પોતાના મુખારવિંદની આગળ પરમહંસ તથા દેશદેશના હરિભક્તની સભા ભરાઇને બેઠી હતી ને પરમહંસ તાલ મૃદંગ લઇને કીર્તન ગાતા હતા.","પછી શ્રીજીમહારાજ સંત પ્રત્યે બોલ્યા જે, એકાદશીનું વ્રત કરવું તેની તો એમ વિગતી છે જે, પૂર્વે ભગવાન દશ ઇન્દ્રિયો અને અગિયારમું મન તેને અંતર સન્મુખ કરીને પોઢ્યા હતા. તે સમયમાં નાડીજંઘનો દીકરો જે મુરદાનવ તે યુદ્ધ કરવા આવ્યો. પછી ભગવાનના એકાદશ ઇન્દ્રિયોના તેજમાંથી એક કન્યા ઉત્પન્ન થઇ, ત્યારે મુરદાનવ કન્યા પ્રત્યે બોલ્યો જે, ‘તું મને વર્ય.’ પછી કન્યા બોલ્યાં જે, મારે તો એવી પ્રતિજ્ઞા છે જે, ‘જે મને યુદ્ધમાં જીતે તેને હું વરું.’ પછી મુરદાનવને અને કન્યાને યુદ્ધ થયું, ત્યારે કન્યાએ મુરદાનવનું મસ્તક ખડગે કરીને કાપી નાખ્યું. પછી ભગવાને પ્રસન્ન થઇને તે કન્યાને કહ્યું જે, ‘તું વર માગ.’ ત્યારે તે કન્યાએ વર માગ્યો જે, મારા વ્રતને દિવસે કોઇ અન્ન ન ખાય અને હું તમારા એકાદશ ઇન્દ્રિયોના તેજમાંથી પ્રકટ થઇ માટે મારું નામ એકાદશી છે અને હું તપસ્વિની છું, માટે મારા વ્રતને દિવસ મન આદિક જે અગિયાર ઇન્દ્રિયો તેનો જે આહાર તે કોઇ કરે નહિ. આવું એકાદશીનું વચન સાંભળીને ભગવાને તે વર આપ્યો. એવી રીતે પુરાણની કથા છે.","અને વળી ધર્મશાસ્ત્રમાં પણ એમ કહ્યું છે જે, ‘એકાદશીનું વ્રત કરવું, તે દિવસ કામ, ક્રોધ, લોભાદિક સંબંધી ભૂંડા ઘાટ મનમાં થવા દેવા નહિ, અને દેહે કરીને કાંઇ ભૂંડુ આચરણ કરવું નહિ.’ એમ શાસ્ત્રમાં વચન છે. અને તે શાસ્ત્ર પ્રમાણે જ અમે પણ કહીએ છીએ જે, ‘એકાદશીને દિવસ ઢોર લાંઘણ કરવી નહિ, અને એકાદશ ઇન્દ્રિયોના આહારનો ત્યાગ કરે તે એકાદશી સાચી ને તે વિના તો ઢોર લાંઘણ કહેવાય.’","અને જેમ પ્રાણને અન્નનો આહાર છે, તેમજ શ્રોત્રને શબ્દનો આહાર છે, અને ત્વચાને સ્પર્શનો આહાર છે, ને નેત્રને રૂપનો આહાર છે, ને જિહ્વાને રસનો આહાર છે, ને નાસિકાને ગંધનો આહાર છે, ને મનને સંકલ્પ વિકલ્પનો આહાર છે. એવી રીતે અગિયારે ઇન્દ્રિયોના જુદા જુદા આહાર છે, તે સર્વે આહારનો ત્યાગ કરે તેનું નામ એકાદશી વ્રત કહેવાય. પણ અગિયારે ઇન્દ્રિયો કુમાર્ગે દોડે અને પોતપોતાના અન્નને ખાય તે એકાદશીનું વ્રત શાસ્ત્ર પ્રમાણે ન કહેવાય, માટે એકાદશીનું વ્રત કરવું ત્યારે તો અગિયારે ઇન્દ્રિયોને આહાર કરવા દેવા નહિ, એવું વ્રત પંદર દિવસમાં એક વાર આવે તે ખબડદાર થઇને કરવું, તો તેને ઉપર ભગવાન પ્રસન્ન થાય છે, પણ તે વિના જે ઢોર લાંઘણ તેણે કરીને ભગવાન પ્રસન્ન થતા નથી.","અને શ્વેતદ્વિપમાં જે નિરન્નમુક્ત કહેવાય છે તે તો સદાય એ વ્રત રાખે છે, ક્યારેય પણ એ વ્રતનો ભંગ થવા દેતા નથી, માટે નિરન્ન કહેવાય છે. અને આપણે પણ ઇચ્છા તો એમ રાખવી જે, જેવા શ્વેતદ્વિપમાં નિરન્નમુક્ત છે તેવું જ થવું છે, પણ એ વાતમાં હિમ્મત હારવી નહિ. એવી રીતે જે હિમ્મત રાખીને જેવું મોરે કહ્યું તેવું એકાદશીનું વ્રત કરે અને ભગવાનની કથા કીર્તનાદિકને કરે ને સાંભળે ને રાત્રિએ જાગરણ કરે, તો તે વ્રત સાચું છે, અને શાસ્ત્રમાં એનું જ નામ એકાદશી કહી છે. એટલી વાત કરીને શ્રીજીમહારાજ મૌન રહ્યા ને સંતે કીર્તન ગાવવા માંડ્યાં."],"en":["On the morning of Shravan Sud 12 (Dwadashi), Samvat 1878, Swami Shri Sahajanandji Maharaj was seated on a mat in front of the shrine of Shri Vasudevnarayan in Dada Khachar's court at Gadhada. He was dressed entirely in white. Before him sat an assembly of paramhansas and devotees from many places. The paramhansas were singing devotional songs accompanied by cymbals and mridangs.","Then Shriji Maharaj addressed the sadhus: “This is the explanation of how to observe the Ekadashi fast. Once, the Lord withdrew the ten senses and the eleventh, the mind, inward and lay down to rest. At that time, the demon Mura, the son of Nadijangha, came to fight. A maiden appeared from the radiance of the Lord's eleven senses. Mura said to the maiden, ‘Marry me.’ She replied, ‘I have vowed to marry only the one who defeats me in battle.’ The maiden and Mura fought, and she severed his head with a sword. Pleased, the Lord asked her to seek a boon. She asked that no one eat grain on the day of her observance; since she had manifested from the brilliance of His eleven senses, she would be called Ekadashi. She was an ascetic, so on her day no one should feed the mind and the other eleven senses with their respective objects. Hearing her request, the Lord granted the boon. This is the account given in the Puranas.”","The Dharmashastras also teach: “On Ekadashi one must not allow impure thoughts connected with lust, anger, greed and the like to arise in the mind, nor commit any improper acts with the body.” We say the same in accordance with the scriptures: “Ekadashi is not merely abstaining from food like a fasting animal. True Ekadashi is to give up the food of the eleven senses; without that, it is only an outward fast.”","Just as food nourishes one's life-force, sound is the food of the ears; touch is the food of the skin; forms are the food of the eyes; tastes are the food of the tongue; smells are the food of the nose; and thoughts and alternatives are the food of the mind. Thus, each of the eleven senses has its own food. Abstaining from all these is called the Ekadashi observance. If the senses continue to run along improper paths and consume their own objects, it is not Ekadashi as taught by scripture. Therefore, when observing Ekadashi, one should restrain the eleven senses from their foods. This vow comes once every fortnight; it should be observed attentively. God is pleased by such an observance, not by mere outward fasting.","In Shvetadvip, those known as the Niranna-muktas observe this vow at all times and never allow it to be broken; for that reason they are called Niranna. We too should aspire to become like the Niranna-muktas of Shvetadvip and never lose courage. One who courageously observes Ekadashi as described, performs and hears the Lord's spiritual discourses and devotional songs, and keeps vigil at night, truly observes this vow. Scripture calls this the true Ekadashi. Having said this, Shriji Maharaj became silent, and the sadhus resumed singing kirtans."],"roman":["sanvat 1878 naa shraavan sudi 12 dvaadasheene divas praatahkaalane same svaamee shreesahajaanandajee mahaaraaj shreegadhadaa madhye daadaakhaacharanaa darabaaramaan shreevaasudevanaaraayananaa mandir aagal chaakalaa upar viraajamaan hataa, ane sarve shvet vastr dhaaran karyaan hataan, ane potaanaa mukhaaravindanee aagal paramahans tathaa deshadeshanaa haribhaktanee sabhaa bharaaine bethee hatee ne paramahans taal mrudang laine keertan gaataa hataa.","pachhee shreejeemahaaraaj sant pratye bolyaa je, ekaadasheenun vrat karavun tenee to em vigatee chhe je, poorve bhagavaan dash indriyo ane agiyaaramun man tene antar sanmukh kareene podhyaa hataa. te samayamaan naadeejanghano deekaro je muradaanav te yuddh karavaa aavyo. pachhee bhagavaananaa ekaadash indriyonaa tejamaanthee ek kanyaa utpann thai, tyaare muradaanav kanyaa pratye bolyo je, ‘tun mane vary.’ pachhee kanyaa bolyaan je, maare to evee pratijnyaa chhe je, ‘je mane yuddhamaan jeete tene hun varun.’ pachhee muradaanavane ane kanyaane yuddh thayun, tyaare kanyaae muradaanavanun mastak khadage kareene kaapee naakhyun. pachhee bhagavaane prasann thaine te kanyaane kahyun je, ‘tun var maag.’ tyaare te kanyaae var maagyo je, maaraa vratane divase koi ann n khaay ane hun tamaaraa ekaadash indriyonaa tejamaanthee prakat thai maate maarun naam ekaadashee chhe ane hun tapasvinee chhun, maate maaraa vratane divas man aadik je agiyaar indriyo teno je aahaar te koi kare nahi. aavun ekaadasheenun vachan saanbhaleene bhagavaane te var aapyo. evee reete puraananee kathaa chhe.","ane valee dharmashaastramaan pan em kahyun chhe je, ‘ekaadasheenun vrat karavun, te divas kaam, krodh, lobhaadik sanbandhee bhoondaa ghaat manamaan thavaa devaa nahi, ane dehe kareene kaani bhoondu aacharan karavun nahi.’ em shaastramaan vachan chhe. ane te shaastr pramaane j ame pan kaheee chheee je, ‘ekaadasheene divas dhor laanghan karavee nahi, ane ekaadash indriyonaa aahaarano tyaag kare te ekaadashee saachee ne te vinaa to dhor laanghan kahevaay.’","ane jem praanane annano aahaar chhe, temaj shrotrane shabdano aahaar chhe, ane tvachaane sparshano aahaar chhe, ne netrane roopano aahaar chhe, ne jihvaane rasano aahaar chhe, ne naasikaane gandhano aahaar chhe, ne manane sankalp vikalpano aahaar chhe. evee reete agiyaare indriyonaa judaa judaa aahaar chhe, te sarve aahaarano tyaag kare tenun naam ekaadashee vrat kahevaay. pan agiyaare indriyo kumaarge dode ane potapotaanaa annane khaay te ekaadasheenun vrat shaastr pramaane n kahevaay, maate ekaadasheenun vrat karavun tyaare to agiyaare indriyone aahaar karavaa devaa nahi, evun vrat pandar divasamaan ek vaar aave te khabadadaar thaine karavun, to tene upar bhagavaan prasann thaay chhe, pan te vinaa je dhor laanghan tene kareene bhagavaan prasann thataa nathee.","ane shvetadvipamaan je nirannamukt kahevaay chhe te to sadaay e vrat raakhe chhe, kyaarey pan e vratano bhang thavaa detaa nathee, maate nirann kahevaay chhe. ane aapane pan ichchhaa to em raakhavee je, jevaa shvetadvipamaan nirannamukt chhe tevun j thavun chhe, pan e vaatamaan himmat haaravee nahi. evee reete je himmat raakheene jevun more kahyun tevun ekaadasheenun vrat kare ane bhagavaananee kathaa keertanaadikane kare ne saanbhale ne raatrie jaagaran kare, to te vrat saachun chhe, ane shaastramaan enun j naam ekaadashee kahee chhe. etalee vaat kareene shreejeemahaaraaj maun rahyaa ne sante keertan gaavavaa maandyaan."]};
const $=id=>document.getElementById(id);
const localeOrder=['gu','en','roman'],locIndex={gu:0,en:1,roman:2};
let lang='gu',screen='home',round=[],questionIndex=0,totalPoints=0,answers=[],answered=false,selection=null,secondsRemaining=30,questionDeadline=0,revealDeadline=0,phase='normal',feedbackTimer=null,timerId=null,prevQuestionOrder='',lastWrong={},lastCorrectPosition={},readerPages=[],readerIndex=0,reviewIndex=0,studyIndex=0,comingTopic='satsang',previousScreen='home';
const t=key=>TEXT[key]?.[locIndex[lang]] ?? key;
const digits=n=>lang==='gu'?String(n).replace(/[0-9]/g,d=>'૦૧૨૩૪૫૬૭૮૯'[Number(d)]):String(n);
const randomInt=max=>{if(window.crypto?.getRandomValues){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]%max;}return Math.floor(Math.random()*max);};
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function cancelTimers(){clearInterval(timerId);clearTimeout(feedbackTimer);timerId=null;feedbackTimer=null;}
function show(id){if(id==='home'||id==='categories'||id==='coming'){if(window.parent!==window){try{parent.postMessage({satsangBox:'close'},'*')}catch(x){}return;}location.replace('../index.html#z1');return;}if(screen==='quiz'&&id!=='quiz')cancelTimers();previousScreen=screen;screen=id;document.querySelectorAll('.stage').forEach(el=>el.classList.toggle('active',el.id===id));$('back').hidden=id==='home';$('homeSpacer').hidden=id!=='home';if(id==='mahima'){readerIndex=0;requestAnimationFrame(buildReader);}if(id==='review'){reviewIndex=0;renderReview();}if(id==='study'){studyIndex=0;renderStudy();}if(id==='coming')$('comingTitle').textContent=t(comingTopic);}
function loadLang(){try{return {g:'gu',e:'en',r:'roman'}[localStorage.getItem('satsangLang')]||'gu';}catch(e){return 'gu';}}
function saveLang(){try{localStorage.setItem('satsangLang',{gu:'g',en:'e',roman:'r'}[lang]);}catch(e){}}
function changeLanguage(){lang=localeOrder[(localeOrder.indexOf(lang)+1)%3];saveLang();applyLang();}
function applyLang(){$('languageLabel').textContent={gu:'ગુ',en:'EN',roman:'ABC'}[lang];document.documentElement.lang=lang==='roman'?'en':lang;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$('language').title=t('lang')+' · '+t('langName');$('language').setAttribute('aria-label',t('lang')+' · '+t('langName'));if(screen==='quiz')renderQuestion();if(screen==='mahima'){readerIndex=0;requestAnimationFrame(buildReader);}if(screen==='review')renderReview();if(screen==='study')renderStudy();if(screen==='result')renderResult();if(screen==='coming')$('comingTitle').textContent=t(comingTopic);}
function renderStudy(){const v=Q[studyIndex];if(!v)return;const twin=Q[studyIndex+26];const name=v.correct;const date=twin.correct;$('studyName').textContent=NAMES[name][lang];$('studyDate').textContent=NAMES[date][lang];$('studyCount').textContent=digits(studyIndex+1)+' / '+digits(26);$('studyPrev').disabled=studyIndex===0;$('studyNext').disabled=studyIndex===25;}
function setRoute(id){if(id==='coming'){throw Error('Need topic');}show(id);}
function routeClick(button){const route=button.dataset.route;if(route==='coming'){comingTopic=button.dataset.topic||'satsang';}show(route);}
function pickOptions(q){const bad=q.options.filter(o=>o!==q.correct);if(bad.length!==7)throw Error('Source must have 7 wrong answers');const prev=lastWrong[q.id]||[];let unused=bad.filter(v=>!prev.includes(v));if(unused.length<3)unused=bad;const wrong=shuffle(unused).slice(0,3);lastWrong[q.id]=wrong;const four=shuffle([q.correct,...wrong]);const old=lastCorrectPosition[q.id];let pos=four.indexOf(q.correct);if(old!==undefined&&pos===old){let swap=(pos+1+randomInt(3))%4;[four[pos],four[swap]]=[four[swap],four[pos]];pos=swap;}lastCorrectPosition[q.id]=pos;return {...q,shown:four};}
function restoreRoundHistory(){try{const v=JSON.parse(localStorage.getItem('satsang-ekadashi-52-round-history')||'null');if(v&&typeof v==='object'){prevQuestionOrder=v.order||'';lastWrong=v.wrong||{};lastCorrectPosition=v.positions||{};}}catch(e){}}
function saveRoundHistory(){try{localStorage.setItem('satsang-ekadashi-52-round-history',JSON.stringify({order:prevQuestionOrder,wrong:lastWrong,positions:lastCorrectPosition}));}catch(e){}}
function begin(){cancelTimers();totalPoints=0;questionIndex=0;answers=[];let list=shuffle(Q);if(list.map(q=>q.id).join(',')===prevQuestionOrder)list=list.slice(1).concat(list[0]);prevQuestionOrder=list.map(q=>q.id).join(',');round=list.map(pickOptions);saveRoundHistory();show('quiz');openQuestion();}
function openQuestion(){
 answered=false;selection=null;phase='normal';secondsRemaining=30;
 questionDeadline=Date.now()+30000;revealDeadline=questionDeadline+10000;
 $('feedback').hidden=true;$('skipQuestion').hidden=false;
 renderQuestion();updateTimer();timerId=setInterval(updateTimer,100);
}
function updateTimer(){
 if(screen!=='quiz'||answered)return;
 const now=Date.now();let ms;
 if(now<questionDeadline){
  phase='normal';ms=questionDeadline-now;secondsRemaining=ms/1000;
  $('timerCircle').style.background=`conic-gradient(#e59b77 ${secondsRemaining/30*360}deg,#e5d1b8 0)`;
 }else if(now<revealDeadline){
  phase='grace';ms=revealDeadline-now;secondsRemaining=ms/1000;
  $('timerCircle').style.background=`conic-gradient(#e5a44b ${secondsRemaining/10*360}deg,#e5d1b8 0)`;
 }else{
  phase='revealed';secondsRemaining=0;finishAnswer(null,'reveal');return;
 }
 $('timerValue').textContent=digits(Math.ceil(secondsRemaining));
 $('timerCircle').title=phase==='grace'?t('graceTime'):t('time');
}
function renderQuestion(){
 const q=round[questionIndex];if(!q)return;
 $('questionNo').textContent=digits(questionIndex+1)+' / '+digits(round.length);
 $('points').textContent=digits(totalPoints);$('questionText').textContent=q.question[lang];
 $('progressBar').style.width=(100*(questionIndex+(answered?1:0))/round.length)+'%';
 $('skipQuestion').hidden=answered;
 const root=$('choices');root.replaceChildren();
 q.shown.forEach((val,i)=>{
  const b=document.createElement('button');b.className='clay choice';b.type='button';b.disabled=answered;b.dataset.key=val;
  const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];
  const word=document.createElement('span');word.className='word';word.textContent=NAMES[val][lang];b.append(l,word);
  if(answered&&val===q.correct){
   b.classList.add('right');if(answers[answers.length-1]?.revealed)b.classList.add('revealBlink');
   const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent='✓';b.append(symbol);
  }
  if(answered&&val===selection&&selection!==q.correct)b.classList.add('wrong');
  b.addEventListener('click',()=>finishAnswer(val,'clicked'));root.append(b);
 });
 if(answered)renderFeedback();
}
function finishAnswer(val,reason){
 if(answered||screen!=='quiz')return;
 const now=Date.now();
 if(reason==='clicked'&&now>=revealDeadline){reason='reveal';val=null;}
 const q=round[questionIndex];
 const correct=reason==='clicked'&&val===q.correct;
 const timeout=reason==='reveal';const skipped=reason==='skip';
 let earned=0;
 if(correct){
  earned=now<questionDeadline?Math.max(20,Math.min(100,20+Math.round(80*(questionDeadline-now)/30000))):20;
 }
 cancelTimers();answered=true;selection=val;
 phase=timeout?'revealed':'answered';secondsRemaining=Math.max(0,(questionDeadline-now)/1000);
 totalPoints+=earned;
 answers.push({q,selection:val,correct,timeout,skipped,earned,revealed:timeout});
 renderQuestion();$('points').textContent=digits(totalPoints);
 $('timerValue').textContent=digits(Math.max(0,Math.ceil(secondsRemaining)));
}
function renderFeedback(){
 const a=answers[answers.length-1];if(!a)return;const q=a.q;
 $('feedback').hidden=false;$('feedback').classList.toggle('bad',!a.correct);
 $('feedbackTitle').textContent=a.revealed?t('revealDone'):(a.skipped?t('skipDone'):(a.correct?t('correct'):t('incorrect')));
 $('feedbackDetail').textContent=t('rightAns')+': '+NAMES[q.correct][lang];
 $('feedbackPoints').textContent='+'+digits(a.earned)+' '+t('score');
 $('proceed').querySelector('span').textContent=questionIndex===round.length-1?t('result'):t('next');
}
function advance(){if(screen!=='quiz'||!answered)return;cancelTimers();if(questionIndex===round.length-1){show('result');renderResult();}else{questionIndex++;openQuestion();}}
function renderResult(){
 const right=answers.filter(a=>a.correct).length,wrong=answers.filter(a=>!a.correct&&!a.timeout&&!a.skipped).length;
 const timeout=answers.filter(a=>a.timeout||a.skipped).length;
 $('finalScore').textContent=digits(totalPoints)+' / '+digits(round.length*100);
 $('correctTotal').textContent=digits(right);$('wrongTotal').textContent=digits(wrong);$('timeoutTotal').textContent=digits(timeout);
}
function renderReview(){
 const a=answers[reviewIndex];if(!a)return;
 $('reviewNo').textContent=t('q')+' '+digits(reviewIndex+1);
 $('reviewQuestion').textContent=a.q.question[lang];
 $('reviewOutcome').textContent=a.correct?t('correct'):a.timeout?t('timeUp'):a.skipped?t('skipDone'):t('incorrect');
 $('reviewCorrect').textContent=t('rightAns')+': '+NAMES[a.q.correct][lang];
 $('reviewPoints').textContent='+'+digits(a.earned)+' '+t('score');
 $('reviewCount').textContent=digits(reviewIndex+1)+' / '+digits(answers.length);
 $('reviewPrev').disabled=reviewIndex===0;$('reviewNext').disabled=reviewIndex===answers.length-1;
}
function displayReaderSegments(parts){const root=$('readerBody');root.replaceChildren();for(const part of parts){const p=document.createElement('p');p.dataset.p=String(part.n);p.textContent=part.text;root.append(p);}}
function buildReader(){if(screen!=='mahima')return;const orig=MAHIMA[lang],container=$('readerBody');if(container.clientHeight<10){requestAnimationFrame(buildReader);return;}const pages=[];let active=[];for(let pi=0;pi<orig.length;pi++){const words=orig[pi].match(/\S+\s*/gu)||[];for(const word of words){if(!active.length||active[active.length-1].n!==pi)active.push({n:pi,text:''});const last=active[active.length-1],old=last.text;last.text+=word;displayReaderSegments(active);if(container.scrollHeight>container.clientHeight+1){last.text=old;if(!last.text.trim())active.pop();if(active.length){pages.push(active.map(v=>({...v})));}active=[{n:pi,text:word}];displayReaderSegments(active);}}}if(active.length)pages.push(active);readerPages=pages.length?pages:[[{n:0,text:''}]];readerIndex=Math.min(readerIndex,readerPages.length-1);renderReader();}
function renderReader(){displayReaderSegments(readerPages[readerIndex]||[]);$('readerCount').textContent=digits(readerIndex+1)+' / '+digits(readerPages.length);$('readPrev').disabled=readerIndex===0;$('readNext').disabled=readerIndex===readerPages.length-1;}
