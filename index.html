<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --cream:#fff6e6;--cream2:#ffe9c7;--saffron:#f08a24;--deep:#7a3410;--ink:#3b2410;--muted:#7b5a3a;
  --gold:#d9a23a;--card:#fffdf8;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#ffd9a0 0%,var(--cream) 45%,var(--cream2) 100%);
  color:var(--ink);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;padding:10px 0 18px}
.om{font-size:34px;line-height:1;color:var(--saffron);text-shadow:0 2px 10px rgba(240,138,36,.35)}
h1{margin:6px 0 2px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:34px;line-height:1.2;color:var(--deep)}
.sub{margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;gap:14px}
a.game{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--card);border:1.5px solid #f0cf94;border-radius:20px;padding:14px 14px 14px 12px;
  box-shadow:0 6px 18px rgba(122,52,16,.12);transition:transform .15s,box-shadow .15s;
}
a.game:active{transform:scale(.98);box-shadow:0 2px 8px rgba(122,52,16,.12)}
a.game:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.no{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#ffb04a,var(--saffron));color:#fff;font-family:'Baloo Bhai 2',sans-serif;font-weight:700;font-size:22px;
  box-shadow:0 0 0 3px #fff6e6,0 0 0 4.5px var(--gold);
}
.txt{min-width:0}
.name{font-weight:700;font-size:19px;line-height:1.35;color:var(--deep)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.play{
  flex:none;padding:9px 16px;border-radius:99px;background:var(--saffron);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 3px 10px rgba(240,138,36,.4);
}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:70;min-width:46px;height:46px;padding:0 10px;border-radius:99px;border:2px solid var(--gold);background:var(--card);color:var(--deep);font:700 17px 'Baloo Bhai 2',sans-serif;box-shadow:0 4px 12px rgba(122,52,16,.2);cursor:pointer}
.lang:active{transform:scale(.94)}
.lang:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.back{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:9px 16px;border-radius:99px;border:2px solid var(--gold);background:var(--card);color:var(--deep);font:700 15px 'Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(122,52,16,.15)}
.back:active{transform:scale(.96)}
.ztitle{margin:0 0 14px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:26px;color:var(--deep);line-height:1.3}
.no.em{font-size:26px;background:linear-gradient(145deg,#ffd27a,#f4a640)}
footer{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
<link rel="stylesheet" href="intro/intro.css">
</head>
<body>
<button type="button" class="lang" id="lang" aria-label="ભાષા / Language">G</button>
<main class="wrap">
  <header>
    <div class="om" aria-hidden="true">ॐ</div>
    <h1 id="h1">સત્સંગ બોક્સ</h1>
    <p class="sub" id="sub">રમો અને શીખો</p>
  </header>

  <nav class="grid" id="nav" aria-label="ગેમ યાદી"></nav>

  <footer id="foot">નવી ગેમ ઉમેરાતી રહેશે</footer>
</main>
<script>
(function(){
var K="satsangLang",O=["g","e","r"],LB={g:"G",e:"E",r:"G.a"};
var Z=[
 {id:"z1",em:"🧠",g:["prashn-leela"]},
 {id:"z2",em:"🧘",g:["dhyan-murti"]},
 {id:"z3",em:"🧩",g:["fal-ful-memory"]},
 {id:"z4",em:"🎮",g:["antahshatru-vijay"]}
];
var G={"prashn-leela":{no:1,n:"n1",t:"t1"},"dhyan-murti":{no:2,n:"n2",t:"t2"},"antahshatru-vijay":{no:3,n:"n3",t:"t3"},"fal-ful-memory":{no:4,n:"n4",t:"t4"}};
var D={
g:{h1:"સત્સંગ બોક્સ",sub:"રમો અને શીખો",z1:"જ્ઞાન-પ્રશ્ન",z2:"ધ્યાન-ભક્તિ",z3:"યાદશક્તિ",z4:"મજાની રમત",one:"૧ ગેમ",back:"← પાછા",n1:"સત્સંગ પ્રશ્ન",t1:"નામ પેટી · પાંચ બોક્સ પ્રશ્નોત્તરી",n2:"ધ્યાન દર્શન",t2:"ધ્યાન મૂર્તિ ગેમ · ચિહ્ન અને તિલ યાદ કરી મૂર્તિ પર મૂકો",n3:"અંતઃશત્રુ વિજય",t3:"દિવ્ય તેજ પાંખ · દોષોને હરાવો",n4:"ફળ ફૂલ મેમરી ગેમ",t4:"કાગળ પર જોયેલું યાદ રાખી જગ્યાએ મૂકો",play:"રમો",foot:"નવી ગેમ ઉમેરાતી રહેશે"},
e:{h1:"Satsang Box",sub:"Play and learn",z1:"Knowledge Quiz",z2:"Meditation & Devotion",z3:"Memory",z4:"Fun Games",one:"1 game",back:"← Back",n1:"Satsang Prashn",t1:"Naam Peti · five-box quiz",n2:"Dhyan Darshan",t2:"Dhyan Murti game · remember the marks and place them on the murti",n3:"Antahshatru Vijay",t3:"Divya Teja Pankh · defeat the faults",n4:"Fruit Flower Memory Game",t4:"Remember what you saw on the paper and put it back in place",play:"Play",foot:"New games will keep being added"},
r:{h1:"Satsang Box",sub:"Ramo ane shikho",z1:"Gnan Prashn",z2:"Dhyan Bhakti",z3:"Yaadshakti",z4:"Majani Ramat",one:"1 game",back:"← Pachha",n1:"Satsang Prashn",t1:"Naam Peti · panch box prashnottari",n2:"Dhyan Darshan",t2:"Dhyan Murti game · chihna ane til yaad rakhi murti par mukho",n3:"Antahshatru Vijay",t3:"Divya Teja Pankh · doshone harawo",n4:"Fal Ful Memory Game",t4:"Kagal par joyelu yaad rakhi jagyae mukho",play:"Ramo",foot:"Navi game umerati raheshe"}
};
var L="g";try{var s0=localStorage.getItem(K);if(D[s0])L=s0}catch(e){}
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function card(href,noTxt,isEm,name,note,playTxt){
  var a=el("a","game");a.href=href;
  var no=el("span","no"+(isEm?" em":""),noTxt);
  var tx=el("span","txt");tx.appendChild(el("span","name",name));tx.appendChild(el("div","note",note));
  a.appendChild(no);a.appendChild(tx);a.appendChild(el("span","play",playTxt));
  return a;
}
function render(){
  var t=D[L],nav=$("nav"),h=(location.hash||"").slice(1),zone=null,i;
  for(i=0;i<Z.length;i++)if(Z[i].id===h)zone=Z[i];
  nav.innerHTML="";
  if(zone){
    var b=el("button","back",t.back);b.type="button";
    b.addEventListener("click",function(){location.hash="";});
    nav.appendChild(b);
    nav.appendChild(el("h2","ztitle",zone.em+" "+t[zone.id]));
    zone.g.forEach(function(k){var g=G[k];nav.appendChild(card(k+"/",String(zone.g.indexOf(k)+1),false,t[g.n],t[g.t],t.play))});
  }else{
    Z.forEach(function(z){nav.appendChild(card("#"+z.id,z.em,true,t[z.id],t.one,t.play))});
  }
  $("h1").textContent=t.h1;$("sub").textContent=t.sub;$("foot").textContent=t.foot;
  $("lang").textContent=LB[L];
  document.documentElement.lang=L==="g"?"gu":"en";
  document.title=t.h1;
}
$("lang").addEventListener("click",function(){
  L=O[(O.indexOf(L)+1)%3];
  try{localStorage.setItem(K,L)}catch(e){}
  render();
  if(window.satsangIntro)window.satsangIntro.lang(L);
});
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
})();
</script>
<script src="intro/intro.js"></script>
