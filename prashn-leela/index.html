<style>
/* layout: title row with language switch and settings gear, category and department chip, step buttons for stepped sections, team score cards with a + card, then a 5x5 grid of coloured boxes; a tapped box opens a large card overlay (question, answer, prize). */
:root{
  --bg:#F4F5FA;--surface:#FFFFFF;--ink:#1F1D2E;--muted:#5E5C73;--line:#D3D5E3;
  --accent:#3C3489;--on-accent:#FFFFFF;--scrim:rgba(20,18,40,.55);
  --b1-lid:#AFA9EC;--b1-body:#CECBF6;--b1-ink:#26215C;
  --b2-lid:#5DCAA5;--b2-body:#9FE1CB;--b2-ink:#04342C;
  --b3-lid:#F0997B;--b3-body:#F5C4B3;--b3-ink:#4A1B0C;
  --b4-lid:#EF9F27;--b4-body:#FAC775;--b4-ink:#412402;
  --b5-lid:#ED93B1;--b5-body:#F4C0D1;--b5-ink:#4B1528;
  --font-display:"Baloo Bhai 2","Noto Sans Gujarati",system-ui,sans-serif;
  --font-body:"Noto Sans Gujarati",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15141D;--surface:#1F1E2B;--ink:#ECEBF5;--muted:#A9A7BE;--line:#37364A;
    --accent:#AFA9EC;--on-accent:#1B1740;--scrim:rgba(0,0,0,.65);
    --b1-lid:#534AB7;--b1-body:#3C3489;--b1-ink:#CECBF6;
    --b2-lid:#0F6E56;--b2-body:#085041;--b2-ink:#9FE1CB;
    --b3-lid:#993C1D;--b3-body:#712B13;--b3-ink:#F5C4B3;
    --b4-lid:#854F0B;--b4-body:#633806;--b4-ink:#FAC775;
    --b5-lid:#993556;--b5-body:#72243E;--b5-ink:#F4C0D1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15141D;--surface:#1F1E2B;--ink:#ECEBF5;--muted:#A9A7BE;--line:#37364A;
  --accent:#AFA9EC;--on-accent:#1B1740;--scrim:rgba(0,0,0,.65);
  --b1-lid:#534AB7;--b1-body:#3C3489;--b1-ink:#CECBF6;
  --b2-lid:#0F6E56;--b2-body:#085041;--b2-ink:#9FE1CB;
  --b3-lid:#993C1D;--b3-body:#712B13;--b3-ink:#F5C4B3;
  --b4-lid:#854F0B;--b4-body:#633806;--b4-ink:#FAC775;
  --b5-lid:#993556;--b5-body:#72243E;--b5-ink:#F4C0D1;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{padding-bottom:90px!important;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:22px 32px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:14px;color:var(--muted);font-weight:500}
h1{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:clamp(34px,9vw,48px);line-height:1.15}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px}
.ld,.lb.fab,#slang,#slang2{display:none!important}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.lang button{font:inherit;font-size:15px;font-weight:500;border:0;background:transparent;color:var(--muted);min-width:44px;height:38px;padding:0 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lb{font:inherit;font-size:16px;font-weight:700;width:52px;height:52px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;flex:none}
.lb.fab{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));z-index:50;width:30px;height:30px;font-size:10px;line-height:1;padding:0;box-shadow:0 1px 5px rgba(0,0,0,.3);border:2px solid var(--surface);opacity:.8}
.lb:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.shead{position:sticky;top:-18px;margin:-18px -18px 0;padding:14px 18px 10px;background:var(--surface);z-index:3;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.shrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sx{font:inherit;font-size:20px;font-weight:700;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.stabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.stabs button{font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:4px 2px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.2}
.stabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.pane{display:flex;flex-direction:column;gap:12px}
.card .clid{gap:8px;flex-wrap:wrap}
.cx{font:inherit;font-size:20px;font-weight:700;width:44px;height:44px;border-radius:999px;border:0;background:rgba(0,0,0,.12);color:inherit;cursor:pointer;flex:none}
.cb{position:relative}
.cb{gap:10px;padding-top:14px}
.who{margin:0;font-size:15px;font-weight:700;padding:2px 12px;border-radius:999px;background:rgba(0,0,0,.12)}
.tmr{display:flex;flex-direction:column;align-items:center;color:inherit}
.tmr svg{width:clamp(84px,24vw,120px);height:auto;display:block;overflow:visible}
.tmr .tnum{font-family:var(--font-display);font-weight:700}
.tmr .pill{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;min-width:96px;padding:10px 18px;border-radius:18px;color:#1A1A1A;text-align:center}
.tmr.hurry svg,.tmr.hurry .pill{animation:hb .5s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.tmr .boom{font-size:72px;line-height:1;animation:boom .6s ease-out}
@keyframes boom{0%{transform:scale(.3) rotate(-20deg);opacity:0}60%{transform:scale(1.35) rotate(8deg);opacity:1}100%{transform:scale(1)}}
.tmr .tup{margin:4px 0 0;font-weight:700;font-size:16px}
.card.shake{animation:sh .45s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.tmr.hurry svg,.tmr.hurry .pill,.tmr .boom,.card.shake{animation:none}}
.peek{font:inherit;font-size:13px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px dashed currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85}
.judge{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.judge button{font:inherit;font-size:17px;font-weight:700;min-height:48px;padding:0 16px;border-radius:12px;border:0;cursor:pointer}
.jr{background:#1D9E75;color:#fff}.jw{background:#D85A30;color:#fff}.jp{background:var(--surface);color:var(--ink)}
.cp.neg{background:#D85A30!important;color:#fff!important}
.cp.lock{background:transparent!important;color:inherit!important;border:2px dashed currentColor;font-size:clamp(18px,5vw,22px)}
.cbk{font:inherit;font-size:15px;font-weight:700;height:44px;padding:0 12px;border-radius:999px;border:0;background:rgba(0,0,0,.14);color:inherit;cursor:pointer;flex:none;white-space:nowrap}
.cbk:focus-visible,.cx:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.rq{width:100%;margin:0 0 2px;font-size:15px;font-weight:700}
.reas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:13px}
.reas button{font:inherit;font-size:14px;font-weight:500;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.reas button[aria-pressed="true"]{background:rgba(0,0,0,.75);color:#fff;border-color:transparent}
.cfoot{display:flex;justify-content:flex-end;align-items:center;width:100%;gap:10px}
.nextb{font:inherit;font-size:16px;font-weight:700;height:44px;padding:0 18px;border-radius:12px;border:0;background:rgba(0,0,0,.75);color:#fff;cursor:pointer}
.back{align-self:flex-start;font:inherit;font-size:15px;font-weight:500;height:40px;padding:0 14px;border-radius:10px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.gift{font:inherit;font-family:var(--font-display);font-weight:700;font-size:clamp(22px,6vw,28px);padding:14px 26px;border-radius:16px;border:3px dashed currentColor;background:transparent;color:inherit;cursor:pointer}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.gift{animation:wob 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gift{animation:none}}
.gear{font-size:20px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button:focus-visible,.bxd:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.chip{display:inline-block;font-size:15px;font-weight:500;padding:4px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.cnt{font-size:14px;color:var(--muted)}
.help{margin:0;color:var(--muted);font-size:15px}
#list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;flex:1;min-height:320px;gap:clamp(8px,2.4vw,14px)}
.wrap{min-height:calc(100dvh - 40px);gap:10px}
body{padding-bottom:16px!important;padding-block:14px 16px}
.bxd{aspect-ratio:auto!important;container-type:size;border-radius:14px}
.lid{height:24%!important;font-size:15cqmin!important;border-radius:14px 14px 0 0!important}
.bd{font-size:44cqmin!important;border-radius:0 0 14px 14px!important}
.bxd:not(.done) .bd{font-size:46cqmin!important}
#lbtn,#gear,#rst{display:none!important}
#hbtn{font-size:0}#hbtn::before{content:"←";font-size:24px;font-weight:700}
.top{justify-content:flex-start}
.tm{padding:2px 8px!important;display:flex;align-items:center;justify-content:center;gap:8px;flex:1 1 70px;min-width:70px!important;border-radius:10px!important}
.tm .tn{font-size:13px!important;line-height:1.2}.tm .ts{font-size:20px!important;line-height:1.1}.tm .tx{font-size:12px!important}
.tm.add{flex:0 0 38px;min-width:38px!important}
.bxd{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;aspect-ratio:1;display:flex;flex-direction:column;min-width:0;transition:opacity .3s}
.lid{flex:none;height:34%;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:clamp(15px,4.4vw,24px);line-height:1}
.bd{flex:1;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:clamp(15px,4.6vw,24px);text-align:center;padding:2px;overflow:hidden;line-height:1.1}
.bxd[hidden]{display:none}
.bxd.done{opacity:1}
.bxd:not(.done) .bd{font-size:clamp(24px,8vw,40px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.bxd:not(.done):active{transform:scale(.94)}
.bxd:not(.done) .bd{animation:sw 3.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.bxd.done .bd{box-shadow:inset 0 0 0 2px rgba(0,0,0,.22)}
.bxd.done .lid{transform:rotate(-8deg) translateY(-2px)}
.c1 .lid{background:var(--b1-lid);color:var(--b1-ink)}.c1 .bd,.card.c1{background:var(--b1-body);color:var(--b1-ink)}
.c2 .lid{background:var(--b2-lid);color:var(--b2-ink)}.c2 .bd,.card.c2{background:var(--b2-body);color:var(--b2-ink)}
.c3 .lid{background:var(--b3-lid);color:var(--b3-ink)}.c3 .bd,.card.c3{background:var(--b3-body);color:var(--b3-ink)}
.c4 .lid{background:var(--b4-lid);color:var(--b4-ink)}.c4 .bd,.card.c4{background:var(--b4-body);color:var(--b4-ink)}
.c5 .lid{background:var(--b5-lid);color:var(--b5-ink)}.c5 .bd,.card.c5{background:var(--b5-body);color:var(--b5-ink)}
.rst{align-self:flex-start;font:inherit;font-size:15px;font-weight:500;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.note{margin:0;font-size:13px;color:var(--muted)}
#teams{display:flex;flex-wrap:wrap;gap:8px}
.tm{flex:1 1 90px;min-width:90px;cursor:pointer;user-select:none;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center}
.tm.cur{border-color:var(--accent)}
.tm p{margin:0}.tm .tn{font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}.tm .ts{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.2}
.tm.add{flex:0 0 52px;min-width:52px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--accent)}
.aw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.aw button{font:inherit;font-size:15px;font-weight:500;min-height:42px;padding:4px 14px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}

.trow button,.addt{font:inherit;font-size:15px;font-weight:500;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

.scr{position:fixed;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hm{display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));color:#5A2410;
background:radial-gradient(circle at 50% 30%,#FFF9E8 0,transparent 55%),radial-gradient(rgba(200,80,30,.10) 1.6px,transparent 1.8px) 0 0/26px 26px,linear-gradient(180deg,#FFEFCB 0%,#FFD99A 62%,#F2A04A 100%)}
.hmin{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}

.ht{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(46px,14vw,72px);line-height:1.1;color:#8B2E10;text-shadow:0 3px 0 #FFE7A8,0 6px 14px rgba(140,60,20,.25)}
.go{font:inherit;font-size:24px;font-weight:700;padding:16px 52px;border:0;border-radius:999px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#E8672A,#B83E14);box-shadow:0 10px 28px rgba(224,112,26,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.hrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}

.hb[aria-pressed="true"]{background:#fff;color:#2d1f63;border-color:#fff}
.hv{margin:14px 0 0;font-size:13px;color:rgba(255,255,255,.55)}

્ટ", "⭐", "🔥"], "lbest": "સૌથી લાંબી સ્ટ્રીક", "rules": [["🛕 વાર્તાની શરૂઆત", "એક સુંદર મંદિર છે. ઉપર ધજા ફરકે છે અને બે ઘંટડીઓ ઝૂલે છે. ધજા દબાવો તો ધીમો અવાજ વાગે, ઘંટડી દબાવો તો ટન… ટન… વાગે! ખીલેલા કમળ પર ▶ દબાવો એટલે સત્સંગ પ્રશ્નની રમત શરૂ."], ["🎁 ખજાનાનાં બોક્સ", "મંદિરની અંદર નંબરવાળાં રંગીન બોક્સ છે. દરેકમાં પૂજાની એક વસ્તુ સંતાયેલી છે. કોઈ પણ બોક્સ દબાવો, એમાંથી એક પ્રશ્ન નીકળશે. પહેલા સ્ટેપમાં ૮ બોક્સ હોય છે."], ["🙋 વારો કોનો?", "રમતમાં ટીમો હોય છે. ઉપર જેનું નામ ‘વારો’ લખેલું હોય તે ટીમ જવાબ આપે. ટીમ કાર્ડ દબાવો તો વારો બદલાય. ઉપર જમણે + થી ટીમ વધે અને − થી ઘટે. એક ટીમ પણ રમી શકે."], ["🤔 પ્રશ્ન અને ઘડિયાળ", "પ્રશ્ન વાંચો અને ઘડિયાળ પૂરી થાય એ પહેલાં જવાબ આપો. શિક્ષક 👁 જવાબ જુઓ દબાવી જવાબ જોઈ શકે. પછી ✓ સાચું કે ✗ ખોટું દબાવો."], ["✍ જવાબ લખીએ", "પછી બાળક જવાબ બોક્સમાં પોતાના હાથે લખે અને ‘આગળ’ દબાવે. લખીએ એટલે યાદ રહી જાય!"], ["🎁 સરપ્રાઈઝ ઇનામ", "સાચું હોય તો 🎁 ખૂલે અને ઇનામના પોઈન્ટ મળે. પણ સાચવજો! કોઈ કોઈ બોક્સમાં − (માઇનસ) પોઈન્ટ પણ સંતાયેલા હોય છે. એટલે પોઈન્ટ ક્યારેક વધે, ક્યારેક ઘટે."], ["⚡ ઝડપનો જાદુ", "જેટલો જલ્દી જવાબ, એટલા વધુ પોઈન્ટ. ઘડિયાળના પહેલા ચોથા ભાગમાં ×૨, અડધા સુધી ×૧.૫, પોણા સુધી ×૧.૨૫, પછી ×૧. માઇનસ ઇનામને ગુણાકાર લાગતો નથી. ઘડિયાળ બંધ હોય તો ×૧."], ["⭐ તારા અને 🔥 આગ", "દરેક સાચા જવાબે ⭐ મળે, ઝડપી જવાબે વધુ. એક જ ટીમના સળંગ ૩ સાચા થાય તો 🔥 પ્રગટે. સળંગ ૫ સાચા થાય તો 🎁 ભેટ +૫૦૦ પોઈન્ટ, અને ફરી ૭, ૯, ૧૧… પર. ખોટો જવાબ આવે તો 🔥 ઓલવાય."], ["🪜 સ્ટેપ ચડીએ", "બધાં બોક્સ ખૂલી જાય એટલે આગલું સ્ટેપ ખૂલે: ૮, ૧૨, ૧૬, ૨૦, ૨૪ બોક્સ… ‘આગળનું સ્ટેપ’ દબાવો. 🔒 વાળું સ્ટેપ આગલું પૂરું કરીએ ત્યારે જ ખૂલે. દર વખતે પ્રશ્નો બોક્સમાં નવેસરથી ભળી જાય છે."], ["⚙ સેટિંગ", "મંદિરની નીચે ⚙ દબાવો. ત્યાં ભાષા (G / E / G.a), વિભાગ (રામાયણ, મહાભારત…), ટીમનાં નામ, ઘડિયાળ અને ઇનામ બદલી શકાય. ફેરફાર ✓ સાચવો દબાવ્યા પછી જ લાગુ થાય. બધું ગોઠવાય એટલે 🎮 રમત તૈયાર કરો દબાવો."]]},

<script>
(function(){
var C=null,bus=null,mg=null,tm=null,wt=null,on=false;
function ensure(){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
if(!C){C=new AC();bus=C.createGain();bus.gain.value=1;bus.connect(C.destination);mg=C.createGain();mg.gain.value=0;mg.connect(bus);
[[110,.07],[165,.045],[220,.03]].forEach(function(a){var o=C.createOscillator(),v=C.createGain();o.type="sine";o.frequency.value=a[0];v.gain.value=a[1];var l=C.createOscillator(),lg=C.createGain();l.frequency.value=.12+a[0]/2000;lg.gain.value=a[1]*.5;l.connect(lg);lg.connect(v.gain);o.connect(v);v.connect(mg);o.start();l.start()})}
if(C.state==="suspended"&&C.resume)C.resume();return true}
function tone(dest,f,peak,dur,mult){var t=C.currentTime,p=[1,2.76,5.4],g=[1,.45,.2],d=[1,.55,.3];
for(var k=0;k<3;k++){var o=C.createOscillator(),v=C.createGain();o.type="sine";o.frequency.value=f*p[k];v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(peak*g[k],t+.008);v.gain.exponentialRampToValueAtTime(.0006,t+dur*d[k]);o.connect(v);v.connect(dest);o.start(t);o.stop(t+dur*d[k]+.1)}}
function bell(){if(C&&on)tone(mg,660,.5,4.5)}
function chime(){if(C&&on)tone(mg,[880,988,1175,1319][Math.floor(Math.random()*4)],.2,2.4)}
function wind(){clearTimeout(wt);if(!on)return;wt=setTimeout(function(){chime();if(Math.random()<.4)setTimeout(chime,260+Math.random()*300);wind()},1800+Math.random()*3200)}
function start(){if(!ensure())return;on=true;mg.gain.cancelScheduledValues(C.currentTime);mg.gain.setTargetAtTime(.9,C.currentTime,.4);bell();clearInterval(tm);tm=setInterval(bell,9000);wind()}
function stop(){on=false;clearInterval(tm);clearTimeout(wt);if(C&&mg){mg.gain.cancelScheduledValues(C.currentTime);mg.gain.setTargetAtTime(0,C.currentTime,.15)}}
