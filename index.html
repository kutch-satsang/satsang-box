<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>સત્સંગ બોક્સ</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f08a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="સત્સંગ બોક્સ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap">
<style>
:root{
  --cream:#fff6e6;--cream2:#ffe9c7;--saffron:#f08a24;--deep:#7a3410;--ink:#3b2410;--muted:#7b5a3a;
  --gold:#d9a23a;--card:#fffdf8;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#ffd9a0 0%,var(--cream) 45%,var(--cream2) 100%);
  color:var(--ink);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;padding:10px 0 18px}
.om{font-size:34px;line-height:1;color:var(--saffron);text-shadow:0 2px 10px rgba(240,138,36,.35)}
h1{margin:6px 0 2px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:34px;line-height:1.2;color:var(--deep)}
.sub{margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;gap:14px}
a.game{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--card);border:1.5px solid #f0cf94;border-radius:20px;padding:14px 14px 14px 12px;
  box-shadow:0 6px 18px rgba(122,52,16,.12);transition:transform .15s,box-shadow .15s;
}
a.game:active{transform:scale(.98);box-shadow:0 2px 8px rgba(122,52,16,.12)}
a.game:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.no{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#ffb04a,var(--saffron));color:#fff;font-family:'Baloo Bhai 2',sans-serif;font-weight:700;font-size:22px;
  box-shadow:0 0 0 3px #fff6e6,0 0 0 4.5px var(--gold);
}
.txt{min-width:0}
.name{font-weight:700;font-size:19px;line-height:1.35;color:var(--deep)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.play{
  flex:none;padding:9px 16px;border-radius:99px;background:var(--saffron);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 3px 10px rgba(240,138,36,.4);
}
footer{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="om" aria-hidden="true">ॐ</div>
    <h1>સત્સંગ બોક્સ</h1>
    <p class="sub">રમો અને શીખો</p>
  </header>

  <nav class="grid" aria-label="ગેમ યાદી">
    <a class="game" href="prashn-leela/">
      <span class="no">1</span>
      <span class="txt"><span class="name">સત્સંગ પ્રશ્ન</span><div class="note">નામ પેટી · પાંચ બોક્સ પ્રશ્નોત્તરી</div></span>
      <span class="play">રમો</span>
    </a>
    <a class="game" href="dhyan-murti/">
      <span class="no">2</span>
      <span class="txt"><span class="name">ધ્યાન દર્શન</span><div class="note">ધ્યાન મૂર્તિ ગેમ · ચિહ્ન અને તિલ યાદ કરી મૂર્તિ પર મૂકો</div></span>
      <span class="play">રમો</span>
    </a>
    <a class="game" href="antahshatru-vijay/">
      <span class="no">3</span>
      <span class="txt"><span class="name">અંતઃશત્રુ વિજય</span><div class="note">દિવ્ય તેજ પાંખ · દોષોને હરાવો</div></span>
      <span class="play">રમો</span>
    </a>
    <a class="game" href="fal-ful-memory/">
      <span class="no">4</span>
      <span class="txt"><span class="name">ફળ ફૂલ મેમરી ગેમ</span><div class="note">કાગળ પર જોયેલું યાદ રાખી જગ્યાએ મૂકો</div></span>
      <span class="play">રમો</span>
    </a>
  </nav>

  <footer>નવી ગેમ ઉમેરાતી રહેશે</footer>
</main>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
