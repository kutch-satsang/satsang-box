<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>સત્સંગ બોક્સ</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f08a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="સત્સંગ બોક્સ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap">
<style>
:root{
  --cream:#fff6e6;--cream2:#ffe9c7;--saffron:#f08a24;--deep:#7a3410;--ink:#3b2410;--muted:#7b5a3a;
  --gold:#d9a23a;--card:#fffdf8;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#ffd9a0 0%,var(--cream) 45%,var(--cream2) 100%);
  color:var(--ink);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;padding:10px 0 18px}
.om{font-size:34px;line-height:1;color:var(--saffron);text-shadow:0 2px 10px rgba(240,138,36,.35)}
h1{margin:6px 0 2px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:34px;line-height:1.2;color:var(--deep)}
.sub{margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;gap:14px}
a.game{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--card);border:1.5px solid #f0cf94;border-radius:20px;padding:14px 14px 14px 12px;
  box-shadow:0 6px 18px rgba(122,52,16,.12);transition:transform .15s,box-shadow .15s;
}
a.game:active{transform:scale(.98);box-shadow:0 2px 8px rgba(122,52,16,.12)}
a.game:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.no{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,#ffb04a,var(--saffron));color:#fff;font-family:'Baloo Bhai 2',sans-serif;font-weight:700;font-size:22px;
  box-shadow:0 0 0 3px #fff6e6,0 0 0 4.5px var(--gold);
}
.txt{min-width:0}
.name{font-weight:700;font-size:19px;line-height:1.35;color:var(--deep)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.play{
  flex:none;padding:9px 16px;border-radius:99px;background:var(--saffron);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 3px 10px rgba(240,138,36,.4);
}
.lang{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:10;min-width:46px;height:46px;padding:0 10px;border-radius:99px;border:2px solid var(--gold);background:var(--card);color:var(--deep);font:700 17px 'Baloo Bhai 2',sans-serif;box-shadow:0 4px 12px rgba(122,52,16,.2);cursor:pointer}
.lang:active{transform:scale(.94)}
.lang:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
footer{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<button type="button" class="lang" id="lang" aria-label="ભાષા / Language">G</button>
<main class="wrap">
  <header>
    <div class="om" aria-hidden="true">ॐ</div>
    <h1 data-k="h1">સત્સંગ બોક્સ</h1>
    <p class="sub" data-k="sub">રમો અને શીખો</p>
  </header>

  <nav class="grid" aria-label="ગેમ યાદી">
    <a class="game" href="prashn-leela/">
      <span class="no">1</span>
      <span class="txt"><span class="name" data-k="n1">સત્સંગ પ્રશ્ન</span><div class="note" data-k="t1">નામ પેટી · પાંચ બોક્સ પ્રશ્નોત્તરી</div></span>
      <span class="play" data-k="play">રમો</span>
    </a>
    <a class="game" href="dhyan-murti/">
      <span class="no">2</span>
      <span class="txt"><span class="name" data-k="n2">ધ્યાન દર્શન</span><div class="note" data-k="t2">ધ્યાન મૂર્તિ ગેમ · ચિહ્ન અને તિલ યાદ કરી મૂર્તિ પર મૂકો</div></span>
      <span class="play" data-k="play">રમો</span>
    </a>
    <a class="game" href="antahshatru-vijay/">
      <span class="no">3</span>
      <span class="txt"><span class="name" data-k="n3">અંતઃશત્રુ વિજય</span><div class="note" data-k="t3">દિવ્ય તેજ પાંખ · દોષોને હરાવો</div></span>
      <span class="play" data-k="play">રમો</span>
    </a>
    <a class="game" href="fal-ful-memory/">
      <span class="no">4</span>
      <span class="txt"><span class="name" data-k="n4">ફળ ફૂલ મેમરી ગેમ</span><div class="note" data-k="t4">કાગળ પર જોયેલું યાદ રાખી જગ્યાએ મૂકો</div></span>
      <span class="play" data-k="play">રમો</span>
    </a>
  </nav>

  <footer data-k="foot">નવી ગેમ ઉમેરાતી રહેશે</footer>
</main>
<script>
(function(){
var K="satsangLang",O=["g","e","r"],LB={g:"G",e:"E",r:"G.a"};
var D={
g:{h1:"સત્સંગ બોક્સ",sub:"રમો અને શીખો",n1:"સત્સંગ પ્રશ્ન",t1:"નામ પેટી · પાંચ બોક્સ પ્રશ્નોત્તરી",n2:"ધ્યાન દર્શન",t2:"ધ્યાન મૂર્તિ ગેમ · ચિહ્ન અને તિલ યાદ કરી મૂર્તિ પર મૂકો",n3:"અંતઃશત્રુ વિજય",t3:"દિવ્ય તેજ પાંખ · દોષોને હરાવો",n4:"ફળ ફૂલ મેમરી ગેમ",t4:"કાગળ પર જોયેલું યાદ રાખી જગ્યાએ મૂકો",play:"રમો",foot:"નવી ગેમ ઉમેરાતી રહેશે"},
e:{h1:"Satsang Box",sub:"Play and learn",n1:"Satsang Prashn",t1:"Naam Peti \u00b7 five-box quiz",n2:"Dhyan Darshan",t2:"Dhyan Murti game \u00b7 remember the marks and place them on the murti",n3:"Antahshatru Vijay",t3:"Divya Teja Pankh \u00b7 defeat the faults",n4:"Fruit Flower Memory Game",t4:"Remember what you saw on the paper and put it back in place",play:"Play",foot:"New games will keep being added"},
r:{h1:"Satsang Box",sub:"Ramo ane shikho",n1:"Satsang Prashn",t1:"Naam Peti \u00b7 panch box prashnottari",n2:"Dhyan Darshan",t2:"Dhyan Murti game \u00b7 chihna ane til yaad rakhi murti par mukho",n3:"Antahshatru Vijay",t3:"Divya Teja Pankh \u00b7 doshone harawo",n4:"Fal Ful Memory Game",t4:"Kagal par joyelu yaad rakhi jagyae mukho",play:"Ramo",foot:"Navi game umerati raheshe"}
};
var L="g";try{var s=localStorage.getItem(K);if(D[s])L=s}catch(e){}
function paint(){
  var t=D[L];
  Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(n){var v=t[n.getAttribute("data-k")];if(v)n.textContent=v});
  document.getElementById("lang").textContent=LB[L];
  document.documentElement.lang=L==="g"?"gu":"en";
  document.title=t.h1;
}
document.getElementById("lang").addEventListener("click",function(){
  L=O[(O.indexOf(L)+1)%3];
  try{localStorage.setItem(K,L)}catch(e){}
  paint();
});
paint();
})();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
