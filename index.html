(function(){
  var NEW="https://kutch-satsang.github.io/box/";
  var p=location.pathname.replace(/^\/satsang-box\/?/,"");
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(a){a.forEach(function(r){r.unregister()})}).catch(function(){});
  if(window.caches&&caches.keys)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})}).catch(function(){});
  location.replace(NEW+p+location.search+location.hash);
})();
</script>
