:root{--ink:#4a2c1c;--deep:#5a3524;--muted:#7b5a3a;--card:#fffaf0;--line:#e3c9a4;--accent:#e8845f;--page:#f4e3cc;
  color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--page);color:var(--ink);font-family:'Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:0 0 28px;min-height:100vh}
/* ---- ઘર (ચિત્ર-થીમ) ---- */
.stage{position:relative;--av:calc(100dvh - 84px - env(safe-area-inset-bottom,0px));width:100%;height:var(--av);margin:0 auto;container-type:inline-size;background:none;overflow:hidden}
.sc{position:absolute;left:0;right:0;top:min(0px,calc(var(--av) - 187.6cqw));height:187.6cqw}
.stage .el{position:absolute;display:block;text-decoration:none;color:inherit;filter:var(--drop,none);transition:transform .15s}
.stage a.el:active{transform:scale(.97)}
.stage a.el:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:30px}
.stage img{display:block;width:100%;height:100%}
.st{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;pointer-events:none;color:var(--lab)}
.st.ti{color:var(--tc);text-shadow:var(--tsh)}
.lng3d{flex:none;width:42px;height:42px;border-radius:50%;border:0;padding:0;cursor:pointer;position:relative;display:grid;place-items:center;align-content:center;color:#4a2a0a;background:radial-gradient(circle at 32% 26%,#fff4d2 0%,#f1c66b 38%,#c9852a 100%);box-shadow:0 4px 0 #8a5a1b,0 8px 12px rgba(90,53,36,.45),inset 0 2px 3px rgba(255,255,255,.8),inset 0 -3px 5px rgba(120,70,10,.35);transition:transform .12s,box-shadow .12s}
.lng3d:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a1b,0 3px 6px rgba(90,53,36,.4),inset 0 2px 3px rgba(255,255,255,.6),inset 0 -2px 4px rgba(120,70,10,.35)}
.lng3d .le{font-size:18px;line-height:1}.lng3d .ll{font:800 9.5px/1 'Baloo Bhai 2',sans-serif;margin-top:1px}
.lng3d.hm{position:absolute;top:3.4cqw;right:3cqw;z-index:5;width:11.5cqw;height:11.5cqw}.lng3d.hm .le{font-size:5.4cqw}.lng3d.hm .ll{font-size:2.5cqw}
.lng3d.flash::after{content:"";position:absolute;inset:-7px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,196,.95) 0%,rgba(255,222,120,.55) 45%,rgba(255,222,120,0) 72%);animation:lngf .75s ease-out forwards;pointer-events:none}
@keyframes lngf{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.lgc{display:flex;justify-content:center;padding:4px 0 8px}
.lang{position:absolute;top:3.4cqw;right:3cqw;z-index:5;display:flex;gap:.8cqw;padding:.9cqw;border-radius:99px;background:var(--pillbg);border:var(--pillbd);box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.28)}
.lang button{border:0;background:transparent;color:var(--pillc);font:700 2.7cqw 'Baloo Bhai 2',sans-serif;min-width:6.6cqw;height:5.6cqw;border-radius:99px;cursor:pointer;padding:0 1cqw}
.lang button.on{background:var(--accent);color:#fff;box-shadow:inset 0 -.5cqw .8cqw rgba(0,0,0,.18)}
.lang button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* ---- અંદરનાં પેજ ---- */
.inner{padding:max(16px,env(safe-area-inset-top)) 16px 8px;min-height:100vh;background:var(--ibg);background-size:cover}
.grid{display:grid;gap:14px}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;border:var(--cardbd);background:var(--card);color:var(--deep);font:700 15px 'Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:var(--cardsh)}
.back:active{transform:scale(.96)}
.lang2{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);border:var(--cardbd)}
.lang2 button{border:0;background:transparent;color:var(--deep);font:700 14px 'Baloo Bhai 2',sans-serif;min-width:40px;height:34px;border-radius:99px;cursor:pointer}
.lang2 button.on{background:var(--accent);color:#fff}
.ztitle{margin:0 0 14px;font-family:'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;font-weight:700;font-size:26px;color:var(--ztc);line-height:1.3}
a.game,div.game{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:var(--cardbd);border-radius:22px;padding:14px 14px 14px 12px;box-shadow:var(--cardsh);transition:transform .15s}
a.game:active{transform:scale(.98)}
a.game:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.no{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#f2a07f,var(--accent));color:#fff;font-family:'Baloo Bhai 2',sans-serif;font-weight:700;font-size:22px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 2px 5px rgba(0,0,0,.18)}
.txt{min-width:0}
.name{font-weight:700;font-size:19px;line-height:1.35;color:var(--deep)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin-top:2px}
.play{flex:none;padding:9px 16px;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.2)}
.play.soon{background:transparent;color:var(--muted);box-shadow:none;border:1.5px dashed var(--line);font-size:13px;font-weight:600}
div.game{opacity:.92}
footer{text-align:center;margin-top:22px;padding:0 16px;font-size:12px;color:var(--fc)}

/* ---- લીલો-સોનેરી: અંદરનાં પેજ + નીચેનું મેનુ (ઘર માટીનું જ રહે) ---- */
:root{--ca:linear-gradient(180deg,#f2a07f,#e8845f);--csh:0 .5rem 1.1rem rgba(120,80,40,.22),inset 0 2px 3px #fff,inset 0 -6px 10px rgba(180,130,80,.1);--zg:linear-gradient(180deg,#f6d98b,#d9a838);--zpanel:linear-gradient(165deg,#1b5b52 0%,#0f423c 60%,#0c3733 100%);--zrim:rgba(224,187,98,.55);--zsh:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -10px 18px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.38)}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap.home{height:100dvh;min-height:0;padding-bottom:0;overflow:hidden}
html.homef,html.homef body{overflow:hidden;height:100%}
/* અંદરનાં પેજ: માટી (ક્લે) સ્ટાઇલ — ક્રીમ ટાઇલ, ટેરાકોટા બટન, ઓલિવ લીલો */
.inner.gg{background:none;color:var(--ink)}
.gg .back,.gg .lang2{background:linear-gradient(160deg,#fdf5e8,#f3e3cb);border:0;box-shadow:var(--csh);color:var(--deep)}
.gg .lang2 button{color:var(--muted)}.gg .lang2 button.on{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15)}
.gg .ztitle{color:var(--deep)}
.gg a.game,.gg div.game,.gg .sbox{background:linear-gradient(160deg,#fdf5e8,#f3e3cb);border:0;box-shadow:var(--csh);border-radius:26px;color:var(--ink)}
.gg .name{color:var(--deep)}.gg .note{color:var(--muted)}
.gg .no{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 3px 6px rgba(120,80,40,.3)}
.gg .play{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),0 3px 6px rgba(120,80,40,.3)}
.gg .play.soon{background:transparent;color:var(--muted);border:1.5px dashed #d9bb90;box-shadow:none}
.sbox{border-radius:26px;padding:16px;margin:0 0 14px}
.sbox h3{margin:0 0 10px;font:700 18px 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;color:var(--deep)}
.sbox p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.sseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sseg button,.sbtn{border:0;background:linear-gradient(160deg,#fdf5e8,#efdcc0);color:var(--deep);border-radius:18px;min-height:50px;font:700 17px 'Baloo Bhai 2','Noto Sans Gujarati',sans-serif;cursor:pointer;box-shadow:var(--csh)}
.sseg button.on,.sbtn.gold{background:var(--ca);color:#fff;box-shadow:inset 0 -3px 6px rgba(0,0,0,.15),0 4px 8px rgba(120,80,40,.3)}
.sbtn{width:100%;padding:0 14px}
.gg footer{color:#8a6a52}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.bnav nav{pointer-events:auto;width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--zpanel);border-top:1.5px solid var(--zrim);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;text-decoration:none;color:#e0bb62;font:700 12px 'Noto Sans Gujarati',sans-serif;line-height:1.3;text-align:center}
.bnav a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bnav a.on{background:var(--zg);color:#3a2600}
.bnav a:focus-visible{outline:3px solid #f6d98b;outline-offset:-2px}
@keyframes omsway{0%,100%{transform:perspective(500px) rotateY(-24deg) translateY(0)}50%{transform:perspective(500px) rotateY(24deg) translateY(-.8cqw)}}
.stage .om{animation:omsway 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.stage .el,a.game{transition:none}.stage .om{animation:none}}

/* નીચેનું મેનુ કાઢ્યું: તેની જગ્યા પણ પાછી */
.stage{--av:calc(100dvh - env(safe-area-inset-bottom,0px))!important}
.wrap{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.wrap.home{padding-bottom:0}

</style>
<style>/* V50 જ્ઞાન-પ્રશ્ન: મોટાં નામ, રમો/લખાણ નહીં, 3D */

</style>
