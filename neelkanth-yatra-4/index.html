<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}</style></head><body><title>નીલકંઠ યાત્રા ૪ Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Serif+Gujarati:wght@700;800&display=swap">
<style>
/* Layout: one-screen app. Header, one main panel that swaps by bottom button, bottom bar of 5 buttons. Sheets slide over for detail and editing. */
:root{
  --bg:#f8efe8; --surf:#ffffff; --surf2:#fbe9d3; --ink:#2a1720; --mute:#7d6068; --line:#ead6c6;
  --mar:#5b0f2e; --mar2:#843158; --saf:#e8821a; --gold:#c9992f; --ok:#1f7a4d; --bad:#b3261e; --onmar:#fff3df;
  --f-disp:"Noto Serif Gujarati","Noto Serif",serif; --f-body:"Noto Sans Gujarati","Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a0c13; --surf:#291420; --surf2:#3a1c2a; --ink:#f6e8dc; --mute:#b99aa3; --line:#47263a;
  --mar:#7a1d44; --mar2:#a24068; --saf:#f19a3c; --gold:#e0b552; --ok:#5ed39b; --bad:#ff8a80; --onmar:#fff3df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a0c13; --surf:#291420; --surf2:#3a1c2a; --ink:#f6e8dc; --mute:#b99aa3; --line:#47263a;
  --mar:#7a1d44; --mar2:#a24068; --saf:#f19a3c; --gold:#e0b552; --ok:#5ed39b; --bad:#ff8a80; --onmar:#fff3df; color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.pad{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:linear-gradient(135deg,var(--mar),var(--mar2));color:var(--onmar);padding-block:10px 12px;border-bottom:4px solid var(--gold)}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-family:var(--f-disp);font-size:21px;line-height:1.3;flex:1;min-width:0}
.hrow h1 small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;opacity:.85}
.hbtn{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:22px;padding:6px 13px;font-size:15px;font-weight:700;color:var(--onmar)}
.hbtn.on{background:var(--saf);border-color:var(--saf);color:#2a1720}
.live{margin-top:8px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;background:rgba(0,0,0,.22);border-radius:14px;padding:6px 12px}
.live b{color:#ffd98a}
.dot{width:9px;height:9px;border-radius:50%;background:#ff5a4d;flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.cloud{font-size:12px;padding:3px 14px;background:var(--surf2);color:var(--mute);text-align:center}
.cloud.warn{color:var(--bad)}
main{flex:1;min-height:0;overflow:auto;padding-block:12px}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:8px 2px 7px;font-size:12.5px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button i{font-style:normal;font-size:22px;line-height:1.2}
nav button.on{color:var(--mar);box-shadow:inset 0 3px 0 var(--saf)}
@media (prefers-color-scheme:dark){nav button.on{color:var(--saf)}}
.daybar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--mar);color:var(--onmar);font-size:20px;flex:none}
.arrow:disabled{opacity:.3}
.dtitle{flex:1;text-align:center;font-family:var(--f-disp);font-size:22px;line-height:1.3;color:var(--mar)}
@media (prefers-color-scheme:dark){.dtitle{color:var(--gold)}}
.dtitle small{display:block;font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--mute)}
.today{display:inline-block;background:var(--saf);color:#2a1720;font-size:12px;font-weight:800;border-radius:10px;padding:0 8px;margin-left:6px}
.hero{background:linear-gradient(135deg,var(--saf),#b5471a 55%,var(--mar));color:#fff;border-radius:20px;padding:12px 14px;margin-bottom:10px}
.hero h2{font-family:var(--f-disp);font-size:19px;line-height:1.45}
.hero .stay{font-size:14px;opacity:.95;margin-top:2px}
.qrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.q{flex:1;min-width:92px;text-align:center;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:14px;padding:7px 6px;font-size:14px;font-weight:700;color:#fff;text-decoration:none}
.tl{display:flex;flex-direction:column;gap:6px}
.ev{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 8px 10px;position:relative}
.ev.cur{border-color:var(--saf);box-shadow:0 0 0 3px color-mix(in srgb,var(--saf) 30%,transparent)}
.ev.nxt{border-style:dashed;border-color:var(--gold)}
.ev.past{opacity:.55}
.tm{font-weight:800;color:var(--mar);font-size:14px;line-height:1.3}
@media (prefers-color-scheme:dark){.tm{color:var(--gold)}}
.tx{font-size:15.5px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.tx .nt{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:0 7px;margin-right:4px}
.tag.c{background:var(--saf);color:#2a1720}.tag.n{background:var(--gold);color:#2a1720}
.acts{display:flex;gap:4px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--surf2);font-size:18px}
.ib.pri{background:var(--mar);color:var(--onmar)}
.add{width:100%;margin-top:8px;border:2px dashed var(--gold);border-radius:16px;padding:10px;font-weight:700;color:var(--mar)}
@media (prefers-color-scheme:dark){.add{color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;min-width:0}
.tile b{display:block;font-family:var(--f-disp);font-size:24px;color:var(--mar);line-height:1.2}
@media (prefers-color-scheme:dark){.tile b{color:var(--gold)}}
.tile span{display:block;font-size:12.5px;color:var(--mute);line-height:1.35;overflow-wrap:anywhere}
.tile small{font-size:12px;font-weight:700}
.tile.now{border-color:var(--saf);background:var(--surf2)}
.tile.sel{border-color:var(--mar);box-shadow:0 0 0 2px var(--mar) inset}
.sec{font-family:var(--f-disp);font-size:20px;color:var(--mar);margin:2px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){.sec{color:var(--gold)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--surf);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.chip.on{background:var(--mar);color:var(--onmar);border-color:var(--mar)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 8px 8px}
.num{width:34px;height:34px;border-radius:50%;background:var(--saf);color:#2a1720;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px}
.num.s{background:var(--mar);color:var(--onmar)}
.nm{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.nm small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.row.x .nm{text-decoration:line-through;color:var(--mute)}.row.x{background:var(--surf2);opacity:.75}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.pager .arrow{width:42px;height:42px}
.pager span{font-weight:700;color:var(--mute);font-size:14px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{background:var(--surf);border:1.5px solid var(--line);border-radius:18px;padding:18px 8px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mbtn i{font-style:normal;font-size:30px}
.note{font-size:13px;color:var(--mute);margin-top:10px;line-height:1.55}

/* live box + date strip (v6, merged against live 1793624307-1c0c) */
header{padding-block:10px 12px}
.lv{display:flex;gap:12px;align-items:center}
.wx{position:relative;width:92px;height:92px;border-radius:22px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}
.wx.day{background:linear-gradient(#3f9bf5,#bfe6ff)}.wx.dawn{background:linear-gradient(#ff9a5a,#ffe0a8)}.wx.dusk{background:linear-gradient(#5b3a8a,#ff8f5a)}.wx.night{background:linear-gradient(#0b1030,#2b3577)}
.sun{position:absolute;width:34px;height:34px;border-radius:50%;background:radial-gradient(#fff7b8,#ffc83a);box-shadow:0 0 22px 8px rgba(255,214,90,.6);animation:glow 3s ease-in-out infinite}
.moon{position:absolute;width:28px;height:28px;border-radius:50%;box-shadow:inset -9px 0 0 0 #fff6d8;transform:rotate(-20deg)}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.2s ease-in-out infinite}
.cl{position:absolute;height:13px;width:38px;border-radius:13px;background:rgba(255,255,255,.9);animation:drift linear infinite}
.cl::before{content:"";position:absolute;left:7px;top:-8px;width:19px;height:19px;border-radius:50%;background:inherit}
.wx.night .cl{background:rgba(190,200,240,.55)}
@keyframes glow{50%{box-shadow:0 0 30px 12px rgba(255,214,90,.8)}}
@keyframes tw{50%{opacity:.2}}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(110px)}}
@media (prefers-reduced-motion:reduce){.sun,.star,.cl{animation:none}}
.lt{flex:1;min-width:0}
.lt .l1{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.lclk{font-family:var(--f-disp);font-size:26px;line-height:1.25;color:#ffd98a;font-variant-numeric:tabular-nums}
.lclk small{font-family:var(--f-body);font-size:12.5px;font-weight:700;color:#fff;opacity:.85}
.lt .l3{font-size:13.5px;font-weight:600;line-height:1.4}.lt .l3 b{color:#ffd98a}
.lnow{margin-top:8px;background:rgba(0,0,0,.24);border-radius:14px;padding:6px 12px;font-size:14.5px;line-height:1.45}
.lnow .nx{font-size:13px;opacity:.9}.lnow b{color:#ffd98a}
.lq{display:inline-block;margin-top:8px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:18px;padding:3px 12px;font-size:13px;font-weight:700;color:var(--onmar);text-decoration:none}
.dstrip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;position:relative;margin:0 -14px 10px;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dstrip::-webkit-scrollbar{display:none}
.dc{flex:none;width:62px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;background:var(--surf);border:1.5px solid var(--line);border-radius:18px;padding:6px 0 7px;line-height:1.3}
.dc small,.dc span{font-size:12px;font-weight:700;color:var(--mute)}
.dc b{font-family:var(--f-disp);font-size:24px;color:var(--mar)}
@media (prefers-color-scheme:dark){.dc b{color:var(--gold)}}
.dc.now{border-color:var(--saf);box-shadow:0 0 0 2px color-mix(in srgb,var(--saf) 35%,transparent)}
.dc.sel{background:var(--mar);border-color:var(--mar)}
.dc.sel small,.dc.sel b,.dc.sel span{color:var(--onmar)}
.hero .dn{font-size:13px;font-weight:700;opacity:.92}

/* v7: whole header is the live sky; smaller date strip below the orange box */
header.hw{position:relative;overflow:hidden;color:#fff;border-bottom:4px solid var(--gold);padding-block:12px 14px;min-height:178px}
header.hw.day{background:linear-gradient(#2f7fd6,#8fd0f7)}
header.hw.dawn{background:linear-gradient(#5d4a9a,#ff9a5a 72%,#ffd89a)}
header.hw.dusk{background:linear-gradient(#3a2a6a,#c8507a 62%,#ff9a5a)}
header.hw.night{background:linear-gradient(#070b24,#1d2760 78%,#2b3577)}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lc{position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.sun{width:64px;height:64px;box-shadow:0 0 36px 14px rgba(255,214,90,.65)}
.moon{width:50px;height:50px;box-shadow:inset -16px 0 0 0 #fff6d8;transform:rotate(-20deg)}
.cl{height:22px;width:74px;border-radius:22px}
.cl::before{left:12px;top:-13px;width:34px;height:34px}
.cl::after{content:"";position:absolute;left:34px;top:-8px;width:26px;height:26px;border-radius:50%;background:inherit}
@keyframes drift{from{transform:translateX(-110px)}to{transform:translateX(calc(100vw + 40px))}}
.lt .l1{font-size:14px}
.lclk{font-size:36px;line-height:1.2}
.lt .l3{font-size:14.5px}
.dstrip{gap:6px;margin:0 -14px 8px;padding:2px 14px 4px}
.dc{width:50px;padding:3px 0 4px;border-radius:14px;line-height:1.2}
.dc b{font-size:19px}
.dc small,.dc span{font-size:10.5px}
header.hw .cl{background:rgba(255,255,255,.4)}
header.hw.day .lclk,header.hw.dawn .lclk{color:#fff}
header.hw.night .cl{background:rgba(190,200,240,.3)}

/* v8: sun path arc, sunrise/sunset row, previous line + day progress */
.arc{position:absolute;inset:0;width:100%;height:100%}
.arc path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.5;stroke-dasharray:3 5;vector-effect:non-scaling-stroke}
.sr{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:8px;font-size:13px;font-weight:600;line-height:1.35}
.sr span:first-child{text-align:left}.sr span:last-child{text-align:right}
.sr b{display:block;font-size:15px;color:#fff}
.sr .md{text-align:center;font-size:12.5px;background:rgba(0,0,0,.26);border-radius:12px;padding:3px 10px}
.prevl{font-size:13.5px;color:var(--mute);margin:0 2px 6px}.prevl b{color:var(--ink)}
.prog{margin:10px 2px 0;font-size:13.5px;color:var(--mute)}
.prog i{display:block;height:8px;border-radius:6px;background:var(--line);margin-top:5px;overflow:hidden}
.prog i u{display:block;height:100%;background:var(--saf);border-radius:6px;text-decoration:none}
/* v9 */
.dc{flex:1 0 50px;width:auto}
/* v10: finished programmes go dark */
.ev.past{opacity:.38;filter:grayscale(.9);background:color-mix(in srgb,var(--ink) 14%,var(--surf));border-style:solid;box-shadow:none}
.ev.past .tm::before{content:"✓ "}
/* v11: finished rows shrink to thin lines so the live one rises */
.ev.past{padding:3px 10px;border-radius:10px;font-size:12.5px;grid-template-columns:86px 1fr auto;gap:6px}
.ev.past .nt,.ev.past .tag{display:none}
.ev.past .tm{white-space:nowrap;font-size:12px}
.ev.past .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past:not(.ed) .acts{display:none}
.ev.past .ib{width:30px;height:30px;font-size:13px}

/* v14: list at bottom, big LIVE panel in the middle */
#main.dayv{display:flex;flex-direction:column}
#main.dayv>*{flex-shrink:0}
.lvp{margin:auto 0;padding:18px 16px;border-radius:22px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--saf) 22%,var(--surf)),var(--surf));border:1.5px solid color-mix(in srgb,var(--saf) 45%,transparent)}
.lvh{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.06em;color:#fff;background:#d6332f;border-radius:20px;padding:3px 12px}
.lvh i{width:8px;height:8px;border-radius:50%;background:#fff;animation:lvb 1.2s infinite}
@keyframes lvb{50%{opacity:.2}}
.lvt{font-size:24px;font-weight:800;line-height:1.3;margin:12px 0 6px;color:var(--ink)}
.lvs{font-size:14px;color:var(--mute)}
.lvbar{height:8px;border-radius:6px;background:var(--line);margin:14px 4px 10px;overflow:hidden}
.lvbar u{display:block;height:100%;background:var(--saf);text-decoration:none;border-radius:6px}
.lvn{font-size:14.5px;color:var(--ink)}.lvn b{color:var(--saf)}
/* v15: day tab calendar shows the viewed date */
.cal{display:inline-flex;flex-direction:column;width:30px;height:30px;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);vertical-align:middle}
.cal s{background:#d6332f;color:#fff;font-size:8.5px;font-weight:800;line-height:11px;text-decoration:none;text-align:center}
.cal b{flex:1;display:grid;place-items:center;color:#222;font-size:15px;font-weight:800;line-height:1}
/* sheet */
#shade{position:absolute;inset:0;background:rgba(20,6,12,.55);z-index:20}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;z-index:21;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.35);border-top:4px solid var(--gold)}
#sheet .sh{display:flex;align-items:center;gap:10px;padding-block:12px 6px}
#sheet .sh h3{font-family:var(--f-disp);font-size:20px;color:var(--mar);flex:1;line-height:1.4}
@media (prefers-color-scheme:dark){#sheet .sh h3{color:var(--gold)}}
#sbody{overflow:auto;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-top:4px}
.mah{background:var(--surf2);border-left:6px solid var(--saf);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.75;margin-bottom:10px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14.5px}
.kv span{background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:4px 10px}
label{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:10px 0 3px}
.in{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px}
textarea.in{min-height:96px;resize:vertical;line-height:1.6}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;text-align:center;background:linear-gradient(90deg,var(--mar),var(--mar2));color:var(--onmar);border-radius:14px;padding:11px;font-weight:800;text-decoration:none;display:block}
.btn.o{background:var(--surf);color:var(--mar);border:2px solid var(--mar)}
.btn.d{background:var(--surf);color:var(--bad);border:2px solid var(--bad)}
@media (prefers-color-scheme:dark){.btn.o{color:var(--gold);border-color:var(--gold)}}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-size:16px;line-height:1.45}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--saf)}
.chk.done span{text-decoration:line-through;color:var(--mute)}
.chk .in{padding:6px 10px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:700;font-size:14px;z-index:40;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mute);padding:24px 10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:8px 6px;text-align:center;min-width:0}
.sum small{display:block;font-size:12.5px;font-weight:700;color:var(--mute)}
.sum b{font-family:var(--f-disp);font-size:19px;line-height:1.4;overflow-wrap:anywhere}
.amt{font-size:16px;white-space:nowrap;align-self:center;padding-right:4px}
.amt.cr,.sum .cr{color:var(--ok)}.amt.dr,.sum .dr{color:var(--bad)}

    '<div class="btns">' + (p.q ? '<a class="btn" target="_blank" rel="noopener" href="' + mapQ(p.q) + '">📍 Google Maps</a><a class="btn o" target="_blank" rel="noopener" href="' + dirQ(p.q) + '">🧭 માર્ગ</a><a class="btn o" target="_blank" rel="noopener" href="' + wxQ(p.q) + '">🌦 હવામાન</a>' : '') + '</div><p class="note">પિન કોડ અને સમય યાત્રા પહેલાં ચકાસી લેવા. ❓ વાળાં નામ નક્કી કરવાનાં બાકી છે.</p>');
}
function noteSheet(eid) {
  const d = curDay(), e = d.ev.find(x => x.id === eid); if (!e) return;
  sheet('✏️ નોંધ • ' + evLabel(e), '<p class="note" style="margin:0 0 4px">' + esc(e.x) + '</p>' + TA('nt', 'નોંધ (દા.ત. મોડું થયું, ફેરફાર, સૂચના)', e.note) +
    '<div class="btns"><button class="btn" data-a="notesave" data-id="' + esc(eid) + '">સાચવો</button></div>');
}
function evSheet(eid) {
  const d = curDay(), e = eid ? d.ev.find(x => x.id === eid) : {tm: '', lb: '', x: '', pl: '', note: ''};
  const opts = '<option value="">— કોઈ નહીં —</option>' + Object.entries(S.places).map(([id, p]) => '<option value="' + esc(id) + '"' + (e.pl === id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('');
  sheet(eid ? '⚙ કાર્યક્રમ બદલો' : '➕ નવો કાર્યક્રમ', F('etm', 'ચોક્કસ સમય (ભારતનો સમય)', e.tm, 'time') + F('elb', 'અથવા શબ્દ (સવારે, બપોરે, સાંજે, રાત્રે)', e.lb) + TA('ex', 'કાર્યક્રમ', e.x) +
    '<label for="epl">સ્થળ (મહિમા માટે)</label><select class="in" id="epl">' + opts + '</select>' +
    '<div class="btns"><button class="btn" data-a="evsave" data-id="' + esc(eid || '') + '">સાચવો</button>' + (eid ? '<button class="btn d" data-a="evdel" data-id="' + esc(eid) + '">કાઢી નાખો</button>' : '') + '</div>');
}
function daySheet() {
  const d = curDay();
  sheet('⚙ દિવસ ' + gu(d.n), F('dd', 'તારીખ', d.date, 'date') + F('dt', 'દિવસનું શીર્ષક', d.title) + F('ds', 'રાત્રિ રોકાણ', d.stay) + F('dc', 'શહેર (હવામાન માટે, અંગ્રેજીમાં)', d.city) +
    '<div class="btns"><button class="btn" data-a="daysave">સાચવો</button></div><p class="note">ફક્ત આ એક દિવસની તારીખ બદલાશે. આખી યાત્રા ખસેડવા "વધુ" → "તારીખ અને નામ" વાપરો.</p>');
}
function personSheet(id) {
  const p = id ? S.people.find(x => x.id === id) : {n: '', age: '', mob: '', sant: false};
  sheet(id ? '✏️ ' + p.n : '➕ નવા યાત્રિક', F('pn', 'નામ', p.n) + F('pa', 'ઉંમર', p.age || '', 'number') + F('pm', 'મોબાઈલ નંબર', p.mob, 'tel') + F('pfd', 'આ યાત્રિકનો ફાળો ₹ (ખાલી = સામાન્ય ફાળો)', p.fund || '', 'number') +
    '<label for="ps">પ્રકાર</label><select class="in" id="ps"><option value="0"' + (!p.sant ? ' selected' : '') + '>હરિભક્ત</option><option value="1"' + (p.sant ? ' selected' : '') + '>સંત</option></select>' +
    '<div class="btns"><button class="btn" data-a="personsave" data-id="' + esc(id || '') + '">સાચવો</button>' + (id ? '<button class="btn d" data-a="persondel" data-id="' + esc(id) + '">કાયમ માટે કાઢો</button>' : '') + '</div>');
}
function listSheet(kind) {
  const arr = S[kind], title = kind === 'take' ? '🎒 શું લેવું' : '📜 નિયમો';
  if (edit) { sheet('✏️ ' + title, arr.map((t, i) => '<div class="chk"><input class="in li" data-i="' + i + '" value="' + esc(t) + '" aria-label="મુદ્દો ' + (i + 1) + '"><button class="ib" data-a="lidel" data-k="' + kind + '" data-i="' + i + '" aria-label="કાઢો">❌</button></div>').join('') +
    '<button class="add" data-a="liadd" data-k="' + kind + '">➕ મુદ્દો ઉમેરો</button><div class="btns"><button class="btn" data-a="lisave" data-k="' + kind + '">સાચવો</button></div>'); return; }
  sheet(title, arr.map((t, i) => kind === 'take' ? '<label class="chk' + (ticks[t] ? ' done' : '') + '"><input type="checkbox" data-a="tick" data-t="' + esc(t) + '"' + (ticks[t] ? ' checked' : '') + '><span>' + esc(t) + '</span></label>' : '<div class="chk"><span>✦ ' + esc(t) + '</span></div>').join('') + (arr.length ? '' : '<div class="empty">કંઈ નથી</div>') + (kind === 'take' ? '<p class="note">ટિક ફક્ત આ ફોનમાં યાદ રહે છે.</p>' : ''));
}
function settingsSheet() {
  const first = S.days[0]?.date || S.cfg.start;
  sheet('⚙️ તારીખ અને નામ', F('cn', 'યાત્રાનું નામ', S.cfg.name) + F('cs', 'પેટા શીર્ષક', S.cfg.sub) + F('c0', 'યાત્રા શરૂ થવાની તારીખ (દિવસ ૧)', first, 'date') + F('cf', 'દરેક હરિભક્તનો ફાળો (₹)', S.cfg.fund || '', 'number') +
    '<div class="btns"><button class="btn" data-a="cfgsave">સાચવો અને બધા દિવસ ખસેડો</button></div><p class="note">તારીખ બદલશો તો ૧૮ એ દિવસની તારીખ સળંગ ગોઠવાઈ જશે. કોઈ એક દિવસ અલગ કરવો હોય તો તે દિવસમાં ⚙ દબાવી તારીખ બદલો.</p>');
}

/* ---------- actions ---------- */
async function saveDay(d) { await put('days/' + d.id, d); }
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-a],[data-v]'); if (!t) return;
  if (t.dataset.v) { view = t.dataset.v; if (view === 'day') { const ti = todayIdx(); dayIdx = ti >= 0 ? ti : 0; dayTouched = false; lastCentered = -1; $('#main').scrollTop = 0; } closeSheet(); render(); return; }
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'tick') return;
  if (a === 'close') return closeSheet();
  if (a === 'edtog') { edit = !edit; closeSheet(); render(); return toast(edit ? 'ફેરફાર ચાલુ: ✏️ ⚙ ➕ ❌ બટન દેખાશે' : 'ફેરફાર બંધ'); }
  if (a === 'tstog') { testMode = !testMode; try { localStorage.setItem('nk_test', testMode ? '1' : '0'); if (testMode) { testStart = '2026-11-01'; } } catch (e) {} dayIdx = 0; const ti2 = todayIdx(); if (ti2 >= 0) dayIdx = ti2; lastCentered = -1; liveSig = ''; render(); return toast(testMode ? 'ટેસ્ટ ચાલુ: ૫ દિવસ, કાલથી' : 'ટેસ્ટ બંધ: અસલી તારીખો'); }
  if (a === 'prev') { dayIdx = Math.max(0, dayIdx - 1); dayTouched = true; return render(); }
  if (a === 'next') { dayIdx = Math.min(S.days.length - 1, dayIdx + 1); dayTouched = true; return render(); }
  if (a === 'goday') { dayIdx = +t.dataset.i; dayTouched = true; view = 'day'; lastCentered = -1; return render(); }
  if (a === 'today') { const i = todayIdx(); dayIdx = i >= 0 ? i : 0; view = 'day'; dayTouched = true; lastCentered = -1; if (i < 0) toast('આજે યાત્રાનો દિવસ નથી'); return render(); }
  if (a === 'pg') { const k = t.dataset.k, dl = +t.dataset.d; if (k === 'pl') plPage += dl; else if (k === 'ac') accPage += dl; else pPage += dl; return render(); }
  if (a === 'pf') { pFilter = t.dataset.k; pPage = 0; return render(); }
  if (a === 'place') return placeSheet(id);
  if (a === 'note') return noteSheet(id);
  if (a === 'ev') return evSheet(id);
  if (a === 'evadd') return evSheet('');
  if (a === 'dayedit') return daySheet();
  if (a === 'person') return personSheet(id);
  if (a === 'personadd') return personSheet('');
  if (a === 'take' || a === 'rules') return listSheet(a);
  if (a === 'settings') return settingsSheet();
  if (a === 'acc') { view = 'acc'; closeSheet(); return render(); }
  if (a === 'accback') { view = 'more'; return render(); }
  if (a === 'atab') { accTab = t.dataset.k; accPage = 0; return render(); }
  if (a === 'pf2') { payFilter = t.dataset.k; accPage = 0; return render(); }
  const shiftM = (d, n) => { const x = new Date(d.slice(0, 7) + '-01T00:00:00Z'); x.setUTCMonth(x.getUTCMonth() + n); return x.toISOString().slice(0, 10); };
  if (a === 'adprev') { accDate = addDays(accDate, -1); return render(); }
  if (a === 'adnext') { accDate = addDays(accDate, 1); return render(); }
  if (a === 'amprev') { accDate = shiftM(accDate, -1); return render(); }
  if (a === 'amnext') { accDate = shiftM(accDate, 1); return render(); }
  if (a === 'ayprev') { accDate = shiftM(accDate, -12); return render(); }
  if (a === 'aynext') { accDate = shiftM(accDate, 12); return render(); }
  if (a === 'ymon') { accDate = t.dataset.m + '-01'; accTab = 'mon'; return render(); }
  if (a === 'qtog') { accQ = !accQ; return render(); }
  if (a === 'qt') { accT = t.dataset.k; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.k === accT)); return; }
  if (a === 'qp') { $('#qx').value = t.dataset.t; $('#qa').focus(); return; }
  if (a === 'qc') { accC = accC === t.dataset.k ? '' : t.dataset.k; document.querySelectorAll('.qc .chip').forEach(b => b.classList.toggle('on', b.dataset.k === accC)); return; }
  if (a === 'qsave') {
    const amt = +$('#qa').value; if (!(amt > 0)) return toast('રકમ લખો');
    const e = {id: 'a' + Date.now().toString(36), t: accT, amt, txt: $('#qx').value.trim(), date: accDate, who: '', c: accC, d: $('#qd').value.trim()};
    S.acc.push(e); S.acc.sort((x, y) => (y.date || '').localeCompare(x.date || '')); render(); await put('acc/' + e.id, e); return toast('સાચવ્યું');
  }
  if (a === 'aadd') return entrySheet('', {date: t.dataset.d});
  if (a === 'aedit') return entrySheet(id);
  if (a === 'pay') { const p = S.people.find(x => x.id === id); return entrySheet('', {t: 'in', who: id, amt: Math.max(0, fundOf(p) - paidOf(id)) || '', txt: 'ફાળો', date: nowIST().date}); }
  if (a === 'aexport') return exportCsv();
  if (a === 'asave') {
    const amt = +V('aa'); if (!(amt > 0)) return toast('રકમ લખો');
    let e = id ? S.acc.find(x => x.id === id) : null; const isNew = !e; if (isNew) e = {id: 'a' + Date.now().toString(36)};
    e.t = $('#at').value; e.amt = amt; e.txt = V('ax'); e.date = V('ad') || nowIST().date; e.who = t.dataset.w || e.who || ''; e.c = $('#ac').value; e.d = V('ae');
    if (isNew) S.acc.push(e); S.acc.sort((a, b) => (b.date || '').localeCompare(a.date || '')); closeSheet(); render(); await put('acc/' + e.id, e); return toast('સાચવ્યું');
  }
  if (a === 'adel') { S.acc = S.acc.filter(x => x.id !== id); closeSheet(); render(); await del('acc/' + id); return toast('કાઢી નાખ્યું'); }
  if (a === 'copy') { const p = S.people.find(x => x.id === id); try { await navigator.clipboard.writeText(p.mob); toast('નંબર કોપી થયો: ' + p.mob); } catch (e) { toast('નંબર: ' + p.mob); } return; }
  if (a === 'cancel') { const p = S.people.find(x => x.id === id); p.st = p.st === 'x' ? 'ok' : 'x'; render(); await put('people/' + id, p); toast(p.st === 'x' ? p.n + ' રદ થયા' : p.n + ' પાછા ચાલુ'); return; }
  if (a === 'notesave') { const e = curDay().ev.find(x => x.id === id); e.note = V('nt'); closeSheet(); render(); await saveDay(curDay()); return toast('નોંધ સાચવી'); }
  if (a === 'evsave') {
    const d = curDay(); let e = id ? d.ev.find(x => x.id === id) : null; const isNew = !e; if (isNew) e = {id: 'e' + Date.now().toString(36), note: ''};
    e.tm = V('etm'); e.lb = V('elb'); e.x = V('ex'); e.pl = $('#epl').value; if (!e.x) return toast('કાર્યક્રમ લખો');
    if (isNew) d.ev.push(e); sortEv(d);
    closeSheet(); render(); await saveDay(d); return toast('સાચવ્યું');
  }
  if (a === 'evdel') { const d = curDay(); d.ev = d.ev.filter(x => x.id !== id); closeSheet(); render(); await saveDay(d); return toast('કાઢી નાખ્યું'); }
  if (a === 'daysave') { const d = curDay(); d.date = V('dd') || d.date; d.title = V('dt'); d.stay = V('ds'); d.city = V('dc'); closeSheet(); render(); await saveDay(d); return toast('સાચવ્યું'); }
  if (a === 'cfgsave') {
    S.cfg.name = V('cn'); S.cfg.sub = V('cs'); S.cfg.fund = +V('cf') || 0; const s0 = V('c0'); const old = S.days[0].date; const shift = s0 ? diffDays(old, s0) : 0;
    if (shift) S.days.forEach(d => d.date = addDays(d.date, shift)); S.cfg.start = s0 || S.cfg.start;
    closeSheet(); render(); const ok = await put('cfg/main', S.cfg); if (ok && shift) for (const d of S.days) await saveDay(d); return toast('સાચવ્યું');
  }
  if (a === 'placesave') { const p = S.places[id]; p.name = V('pn'); p.mahima = $('#pm').value.trim(); p.pin = V('pp').replace(/[^0-9]/g, ''); p.timing = V('pt'); p.q = V('pq'); closeSheet(); render(); await put('places/' + id, p); return toast('સાચવ્યું'); }
  if (a === 'placedel') { delete S.places[id]; S.days.forEach(d => d.ev.forEach(e => { if (e.pl === id) e.pl = ''; })); closeSheet(); render(); await del('places/' + id); for (const d of S.days) await saveDay(d); return toast('કાઢી નાખ્યું'); }
  if (a === 'placeadd') { const nid = 'x' + Date.now().toString(36); S.places[nid] = {name: 'નવું સ્થળ', mahima: '', pin: '', q: '', timing: ''}; render(); await put('places/' + nid, S.places[nid]); return placeSheet(nid); }
  if (a === 'personsave') {
    let p = id ? S.people.find(x => x.id === id) : null; const isNew = !p;
    const sant = $('#ps').value === '1';
    if (isNew) { p = {id: 'p' + Date.now().toString(36), st: 'ok'}; }
    p.n = V('pn'); if (!p.n) return toast('નામ લખો'); p.age = +V('pa') || 0; p.mob = V('pm'); p.fund = +V('pfd') || 0;
    if (isNew || p.sant !== sant) { p.sant = sant; p.no = 1 + Math.max(0, ...S.people.filter(x => x.sant === sant && x.id !== p.id).map(x => x.no)); }
    if (isNew) S.people.push(p); S.people.sort((a, b) => (a.sant - b.sant) || (a.no - b.no)); closeSheet(); render(); await put('people/' + p.id, p); return toast('સાચવ્યું');
  }
  if (a === 'persondel') { S.people = S.people.filter(x => x.id !== id); closeSheet(); render(); await del('people/' + id); return toast('કાયમ માટે કાઢ્યું'); }
  if (a === 'liadd') { collectList(t.dataset.k); S[t.dataset.k].push(''); return listSheet(t.dataset.k); }
  if (a === 'lidel') { collectList(t.dataset.k); S[t.dataset.k].splice(+t.dataset.i, 1); return listSheet(t.dataset.k); }
  if (a === 'lisave') { const k = t.dataset.k; collectList(k); S[k] = S[k].filter(Boolean); closeSheet(); await put('lists/' + k, {items: S[k]}); return toast('સાચવ્યું'); }
});
function collectList(k) { const els = document.querySelectorAll('#sheet .li'); if (els.length) S[k] = [...els].map(e => e.value.trim()); }
document.addEventListener('change', e => { const t = e.target; if (t.dataset?.a === 'tick') { ticks[t.dataset.t] = t.checked; try { localStorage.setItem('nk_ticks', JSON.stringify(ticks)); } catch (x) {} t.closest('.chk').classList.toggle('done', t.checked); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* swipe on the day view */
let sx = null;
$('#main').addEventListener('touchstart', e => { sx = e.target.closest('.dstrip') ? null : e.touches[0].clientX; }, {passive: true});
$('#main').addEventListener('touchend', e => { if (sx == null || view !== 'day') return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) { dayIdx = Math.min(vdays().length - 1, Math.max(0, dayIdx + (dx < 0 ? 1 : -1))); dayTouched = true; lastCentered = -1; render(); } }, {passive: true});

/* ---------- start ---------- */
(function init() { const i = todayIdx(); dayIdx = i >= 0 ? i : 0; render(); })();
setInterval(() => { if (!$('#sheet')) { if (!dayTouched) { const i = todayIdx(); if (i >= 0) dayIdx = i; } render(); } }, 60000);
(async () => {
  try { const u = await claude.use('user'); canW = u ? await u.can('data.write') : null; } catch (e) {}
  try { db = await claude.use('db'); } catch (e) { db = null; }
  try { dlc = await claude.use('downloads'); } catch (e) { dlc = null; }
  hdr(); if (db) subscribe(); else { cloudState = 'err'; hdr(); }
})();
</script>
